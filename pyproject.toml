[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dota-ai-decision-lab"
version = "0.1.0"
description = "Standalone Dota 2 decision-intelligence runtime"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.18,<2",
    "aiosqlite>=0.21,<1",
    "asyncpg>=0.30,<1",
    "curl-cffi>=0.15,<1",
    "fastapi>=0.139,<1",
    "httpx>=0.28,<1",
    "opentelemetry-api>=1.38,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
    "opentelemetry-sdk>=1.38,<2",
    "prometheus-client>=0.23,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "python-socketio[asyncio_client]>=5.15,<6",
    "rfc8785>=0.1,<1",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "structlog>=25.5,<26",
    "tzdata>=2026.3,<2027",
    "uvicorn[standard]>=0.51,<1",
    "websockets>=16,<17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/providers/stratz/draft_queries.py" = ["E501"]
