name: Finalize AI output simplification v2

on:
  push:
    branches:
      - perf/ai-output-simplification

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/ai-output-simplification
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Align docs and add legacy UI regression
        shell: python
        run: |
          from pathlib import Path

          docs = Path("docs/ARCHITECTURE.md")
          text = docs.read_text(encoding="utf-8")
          old_fields = "    primary_reasons: list[str]\n    counter_arguments: list[str]\n    data_quality_concerns: list[str]\n    blockers: list[str]\n"
          new_fields = "    primary_reasons: list[str]\n    blockers: list[str]\n"
          if text.count(old_fields) != 1:
              raise SystemExit(f"architecture fields mismatch: {text.count(old_fields)}")
          text = text.replace(old_fields, new_fields, 1)
          old_requirement = "强制要求：\n\n```text\ncounter_arguments\n```\n\n避免只生成单向解释。\n"
          new_requirement = (
              "模型在形成最终概率、信心与 action 前，仍必须内部审查最强反方证据与数据质量限制；\n"
              "这些因素应体现在 `fair_probability_a`、`confidence` 以及必要时的 `primary_reasons` 中，\n"
              "但当前输出合同不再要求单独生成 `counter_arguments` 或 `data_quality_concerns` 文本数组。\n"
              "`blockers` 只用于会阻止可靠决策的条件。旧实验记录中的两个退役字段保留在历史 JSON 中用于审计，\n"
              "读取历史记录时兼容，但不会被当前模型重新输出。\n"
          )
          if text.count(old_requirement) != 1:
              raise SystemExit(f"architecture requirement mismatch: {text.count(old_requirement)}")
          text = text.replace(old_requirement, new_requirement, 1)
          old_bankroll = "virtual_bankroll: {\n    initial\n    bankroll_before\n    unsettled_stakes\n    units\n    policy\n}\n"
          new_bankroll = "virtual_bankroll: {\n    initial\n    bankroll_before\n    unsettled_stakes\n    units\n}\n"
          if text.count(old_bankroll) != 1:
              raise SystemExit(f"architecture bankroll mismatch: {text.count(old_bankroll)}")
          text = text.replace(old_bankroll, new_bankroll, 1)
          old_identity = "snapshot_id\nprovider\nmodel_version\nprompt_version\ndecision_policy_version\n"
          new_identity = "snapshot_id\nprovider\nmodel\nprompt_version\ndecision_policy_version\nai_view_version\n"
          if text.count(old_identity) != 1:
              raise SystemExit(f"architecture identity mismatch: {text.count(old_identity)}")
          docs.write_text(text.replace(old_identity, new_identity, 1), encoding="utf-8")

          test = Path("frontend/src/components/player-ai-decisions.test.tsx")
          text = test.read_text(encoding="utf-8")
          old_fixture = "      primary_reasons: [\"Draft and price align\"],\n      counter_arguments: [\"Crossover risk\"],\n      data_quality_concerns: [],\n      blockers: [],\n"
          new_fixture = "      primary_reasons: [\"Draft and price align\"],\n      counter_arguments: [\"Crossover risk\"],\n      data_quality_concerns: [\"Legacy quality concern\"],\n      blockers: [],\n"
          if text.count(old_fixture) != 1:
              raise SystemExit(f"frontend legacy fixture mismatch: {text.count(old_fixture)}")
          text = text.replace(old_fixture, new_fixture, 1)
          anchor = "  expect(screen.getByText(\"Draft and price align\")).toBeInTheDocument();\n  expect(screen.getByText(\"Momentum flipped\")).toBeInTheDocument();\n"
          replacement = anchor + "  expect(screen.queryByText(\"Crossover risk\")).not.toBeInTheDocument();\n  expect(screen.queryByText(\"Legacy quality concern\")).not.toBeInTheDocument();\n"
          if text.count(anchor) != 1:
              raise SystemExit(f"frontend assertion anchor mismatch: {text.count(anchor)}")
          test.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
      - name: Verify focused backend contracts
        run: |
          uv sync --frozen --extra dev
          uv run pytest tests/test_ai_v5_performance.py tests/test_ai_coordinator.py tests/test_ai_decision_integrity.py
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit finalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE.md frontend/src/components/player-ai-decisions.test.tsx
          git commit -m "test(ai): cover retired explanation fields"
          git push origin HEAD:perf/ai-output-simplification
