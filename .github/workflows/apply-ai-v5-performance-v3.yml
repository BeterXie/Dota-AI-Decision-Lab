name: Apply AI decision v5 performance patch v3

on:
  push:
    branches:
      - perf/ai-decision-v5

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/ai-decision-v5
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          python-version: "3.14"
      - run: uv sync --frozen --extra dev
      - name: Apply anchored edits
        shell: python
        run: |
          from pathlib import Path
          import re
          from textwrap import dedent

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def one_replace(path: str, old: str, new: str) -> None:
              text = read(path)
              if text.count(old) != 1:
                  raise SystemExit(f"expected one anchor in {path}: {old!r}; got {text.count(old)}")
              write(path, text.replace(old, new, 1))

          # ------------------------------------------------------------------
          # Prompt: same decision semantics, much less duplicated explanation.
          # ------------------------------------------------------------------
          path = "app/ai/base.py"
          text = read(path)
          text = text.replace("from dataclasses import dataclass\n", "import hashlib\nfrom dataclasses import dataclass\n", 1)
          text = text.replace('PROMPT_VERSION = "decision-analyst-v4"', 'PROMPT_VERSION = "decision-analyst-v5-performance"', 1)
          compact_prompt = dedent('''\
          SYSTEM_PROMPT = """You are an independent Dota 2 decision analyst.
          Use only the supplied immutable DecisionSnapshot-derived AI input. Never browse, call
          tools, invent facts, or resolve UNKNOWN/null values yourself. Deterministic quality
          blockers override model judgment. NO_BUY and INSUFFICIENT_DATA are normal outcomes.

          Assess Team A versus Team B exactly as identified by the input. Never assume Team A is
          Radiant or Team B is Dire. Use side-relative evidence only when upstream side identity
          is RESOLVED.

          Decision/output rules:
          - Preserve the schema-defined meanings of action, fair_probability_a, confidence,
            market_assessment, minimum_acceptable_odds_a, and stake.
          - BUY_A/BUY_B require 0 < stake <= virtual_bankroll.bankroll_before.
            NO_BUY/INSUFFICIENT_DATA use stake null/0. Stake is virtual audit capital only.
          - Include concise primary reasons, counter-arguments, data-quality concerns, and
            blockers; use at most three concise strings per explanatory list.
          - Reasons must cite relevant AI-input paths.
          - All descriptive strings must be clear professional Simplified Chinese. Enum literals
            remain the schema-defined uppercase English values.

          Evidence rules:
          - ai_context_summary is deterministic compression of market/draft/history/live/quality,
            not independent evidence. Use it only to orient analysis and never double-count it.
            If summary and raw blocks disagree, raw evidence wins and the mismatch is a quality concern.
          - market_signal.favorite is only the direction of vig-removed market probability, not a
            model forecast or mispricing signal. team_a_vig_adjustment_pp is mechanical vig
            adjustment, never evidence of undervaluation.
          - Positive Team-A-relative draft/history/live deltas or edges favor A; negative values
            favor B. Historical comparisons are comparative evidence, not guaranteed causal effects.
          - signal_agreement is directional consistency only. CONSISTENT does not strengthen
            duplicated evidence; DIVERGENT warrants scrutiny.
          - odds_drift is Team A implied-probability movement. The market is real-time and may
            already price events absent from delayed live data.
          - team_a_nw_lead/team_a_nw_delta and trend_windows describe observed state/momentum,
            not causality. buildings_lost and economy_trajectory are state/context; barracks losses
            imply megacreep risk.
          - draft_live_agreement DIVERGENT warrants scrutiny. Respect position_source,
            position_confidence, player_stats observed_at, and bans as evidence provenance/freshness.
          - live_data_lag_minutes compares delayed live/player data with the real-time market. If
            delayed_live_excluded=true, do not infer withheld live state, trend, buildings,
            economy, or player stats.
          - knowledge_cutoff, observed_at, and statistics_cutoff define freshness. live_sync
            UNKNOWN/CALIBRATING means live alignment may be delayed and should reduce confidence.

          Prior decisions:
          prior_decisions are your own earlier decisions for this match, oldest first. Use them
          only for continuity and calibration, never as independent current evidence. New evidence
          may change the conclusion; do not blindly repeat stale reasoning or chase previous losses.
          """
          ''')
          prompt_pattern = re.compile(r'SYSTEM_PROMPT = """.*?"""\n', re.S)
          text, n = prompt_pattern.subn(compact_prompt, text, count=1)
          if n != 1:
              raise SystemExit("failed to replace system prompt")

          response_class = re.compile(
              r'@dataclass\(frozen=True\)\nclass AiProviderResponse:\n'
              r'    raw_response: dict\[str, Any\]\n'
              r'    decision: AiDecision\n'
              r'    model_version: str\n'
          )
          response_block = dedent('''\
          @dataclass(frozen=True)
          class AiProviderUsage:
              input_tokens: int | None = None
              cached_input_tokens: int | None = None
              reasoning_tokens: int | None = None
              output_tokens: int | None = None
              total_tokens: int | None = None


          @dataclass(frozen=True)
          class AiProviderResponse:
              raw_response: dict[str, Any]
              decision: AiDecision
              model_version: str
              usage: AiProviderUsage | None = None
          ''')
          text, n = response_class.subn(response_block, text, count=1)
          if n != 1:
              raise SystemExit("failed to extend AiProviderResponse")

          helpers = dedent('''\

          def ai_prompt_cache_key(provider: str, model: str) -> str:
              identity = (
                  f"{provider}|{model}|{PROMPT_VERSION}|{DECISION_POLICY_VERSION}|{AI_VIEW_VERSION}"
              )
              digest = hashlib.sha256(identity.encode("utf-8")).hexdigest()[:32]
              return f"dota-ai-decision:{digest}"


          def extract_provider_usage(payload: dict[str, Any] | None) -> AiProviderUsage | None:
              if not isinstance(payload, dict):
                  return None
              usage = payload.get("usage")
              if not isinstance(usage, dict):
                  usage = payload.get("usageMetadata")
              if not isinstance(usage, dict):
                  return None

              input_details = usage.get("input_tokens_details")
              output_details = usage.get("output_tokens_details")
              completion_details = usage.get("completion_tokens_details")
              input_details = input_details if isinstance(input_details, dict) else {}
              output_details = output_details if isinstance(output_details, dict) else {}
              completion_details = (
                  completion_details if isinstance(completion_details, dict) else {}
              )

              cache_read = _usage_int(usage.get("cache_read_input_tokens"))
              cache_creation = _usage_int(usage.get("cache_creation_input_tokens"))
              input_tokens = _first_usage_int(
                  usage.get("total_input_tokens"),
                  usage.get("input_tokens"),
                  usage.get("prompt_tokens"),
              )
              # Anthropic reports uncached/cache-write/cache-read input separately.
              if cache_read is not None or cache_creation is not None:
                  input_tokens = (
                      (_usage_int(usage.get("input_tokens")) or 0)
                      + (cache_read or 0)
                      + (cache_creation or 0)
                  )
              cached_input_tokens = _first_usage_int(
                  usage.get("total_cached_tokens"),
                  input_details.get("cached_tokens"),
                  usage.get("prompt_cache_hit_tokens"),
                  cache_read,
              )
              output_tokens = _first_usage_int(
                  usage.get("total_output_tokens"),
                  usage.get("output_tokens"),
                  usage.get("completion_tokens"),
              )
              reasoning_tokens = _first_usage_int(
                  usage.get("total_thought_tokens"),
                  output_details.get("reasoning_tokens"),
                  completion_details.get("reasoning_tokens"),
              )
              total_tokens = _usage_int(usage.get("total_tokens"))
              if total_tokens is None and input_tokens is not None and output_tokens is not None:
                  total_tokens = input_tokens + output_tokens
              values = (
                  input_tokens,
                  cached_input_tokens,
                  reasoning_tokens,
                  output_tokens,
                  total_tokens,
              )
              if all(value is None for value in values):
                  return None
              return AiProviderUsage(
                  input_tokens=input_tokens,
                  cached_input_tokens=cached_input_tokens,
                  reasoning_tokens=reasoning_tokens,
                  output_tokens=output_tokens,
                  total_tokens=total_tokens,
              )


          def _first_usage_int(*values: object) -> int | None:
              for value in values:
                  parsed = _usage_int(value)
                  if parsed is not None:
                      return parsed
              return None


          def _usage_int(value: object) -> int | None:
              if isinstance(value, bool):
                  return None
              if isinstance(value, int) and value >= 0:
                  return value
              if isinstance(value, float) and value >= 0 and value.is_integer():
                  return int(value)
              return None

          ''')
          marker = "class AiProviderFailure(RuntimeError):\n"
          if text.count(marker) != 1:
              raise SystemExit("AiProviderFailure marker changed")
          text = text.replace(marker, helpers + marker, 1)
          write(path, text)

          # ------------------------------------------------------------------
          # Provider-facing view: retain evidence, remove audit-only version labels.
          # ------------------------------------------------------------------
          path = "app/ai/input.py"
          text = read(path).replace('AI_VIEW_VERSION = "ai-view-v4"', 'AI_VIEW_VERSION = "ai-view-v5"', 1)
          start = text.index("    return {\n", text.index("    view = build_ai_view("))
          end = text.index("    }\n", start) + len("    }\n")
          new_return = dedent('''\
              summary = build_ai_context_summary(view)
              # Version labels remain audit identity on AiDecisionRecord but are not match evidence.
              provider_view = {key: value for key, value in view.items() if key != "ai_view_version"}
              provider_summary = {
                  key: value for key, value in summary.items() if key != "context_summary_version"
              }
              return {
                  **provider_view,
                  "ai_context_summary": provider_summary,
              }
          ''')
          text = text[:start] + new_return + text[end:]
          write(path, text)

          # ------------------------------------------------------------------
          # OpenAI: stable cache key only for official OpenAI adapter + usage.
          # ------------------------------------------------------------------
          path = "app/ai/openai.py"
          text = read(path)
          text = text.replace(
              "    AiProviderResponse,\n    decision_json_schema,\n    parse_decision,\n",
              "    AiProviderResponse,\n    ai_prompt_cache_key,\n    decision_json_schema,\n    extract_provider_usage,\n    parse_decision,\n",
              1,
          )
          decide = text.index("    async def decide(self, snapshot_input: str) -> AiProviderResponse:\n")
          start = text.index("        response = await self._client.post(\n", decide)
          end = text.index("        response.raise_for_status()\n", start)
          request = dedent('''\
                  payload: dict[str, Any] = {
                      "model": self.model,
                      "reasoning": {"effort": self.reasoning_effort},
                      "instructions": SYSTEM_PROMPT,
                      "input": snapshot_input,
                      "text": {
                          "format": {
                              "type": "json_schema",
                              "name": "dota_ai_decision",
                              "schema": decision_json_schema(),
                              "strict": True,
                          }
                      },
                  }
                  # Keep OpenAI-compatible/local and DeepSeek adapters conservative: they may
                  # reject OpenAI-specific cache controls even when their response shape matches.
                  if self.name == "openai":
                      payload["prompt_cache_key"] = ai_prompt_cache_key(self.name, self.model)
                  response = await self._client.post("/responses", json=payload)
          ''')
          text = text[:start] + request + text[end:]
          text = text.replace(
              '            model_version=str(raw.get("model") or self.model),\n        )',
              '            model_version=str(raw.get("model") or self.model),\n'
              '            usage=extract_provider_usage(raw),\n        )',
              1,
          )
          write(path, text)

          for path in ("app/ai/anthropic.py", "app/ai/gemini.py"):
              text = read(path)
              text = text.replace(
                  "    decision_json_schema,\n    parse_decision,\n",
                  "    decision_json_schema,\n    extract_provider_usage,\n    parse_decision,\n",
                  1,
              )
              text = text.replace(
                  '            model_version=str(raw.get("model") or self.model),\n        )',
                  '            model_version=str(raw.get("model") or self.model),\n'
                  '            usage=extract_provider_usage(raw),\n        )',
                  1,
              )
              write(path, text)

          path = "app/ai/chat_completions.py"
          text = read(path)
          text = text.replace(
              "    AiProviderResponse,\n    parse_decision,\n",
              "    AiProviderResponse,\n    extract_provider_usage,\n    parse_decision,\n",
              1,
          )
          text = text.replace(
              '            model_version=str(raw.get("model") or self.model),\n        )',
              '            model_version=str(raw.get("model") or self.model),\n'
              '            usage=extract_provider_usage(raw),\n        )',
              1,
          )
          write(path, text)

          # ------------------------------------------------------------------
          # Coordinator: persist usage; remove duplicated bankroll policy prose.
          # ------------------------------------------------------------------
          path = "app/ai/coordinator.py"
          text = read(path)
          text = text.replace(
              "    ai_experiment_key,\n    validate_ai_decision,\n",
              "    ai_experiment_key,\n    extract_provider_usage,\n    validate_ai_decision,\n",
              1,
          )
          text = text.replace(
              "        model_version = prepared.provider.model\n        received_at = None\n",
              "        model_version = prepared.provider.model\n        usage = None\n        received_at = None\n",
              1,
          )
          text = text.replace(
              "            raw_response = result.raw_response\n            validate_ai_decision(\n",
              "            raw_response = result.raw_response\n            usage = result.usage\n            validate_ai_decision(\n",
              1,
          )
          text = text.replace(
              "            raw_response = exc.raw_response\n            parse_status = exc.parse_status\n",
              "            raw_response = exc.raw_response\n            usage = extract_provider_usage(raw_response)\n            parse_status = exc.parse_status\n",
              1,
          )
          record_anchor = "            latency_seconds=perf_counter() - started_clock,\n"
          if text.count(record_anchor) != 1:
              raise SystemExit("coordinator latency anchor changed")
          text = text.replace(
              record_anchor,
              record_anchor
              + "            input_tokens=usage.input_tokens if usage is not None else None,\n"
              + "            cached_input_tokens=(\n"
              + "                usage.cached_input_tokens if usage is not None else None\n"
              + "            ),\n"
              + "            reasoning_tokens=usage.reasoning_tokens if usage is not None else None,\n"
              + "            output_tokens=usage.output_tokens if usage is not None else None,\n"
              + "            total_tokens=usage.total_tokens if usage is not None else None,\n",
              1,
          )
          text, n = re.subn(
              r'\n            "policy": \(\n'
              r'                "Independent virtual shadow bankroll.*?\n'
              r'            \),',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit("bankroll policy block changed")
          write(path, text)

          # ------------------------------------------------------------------
          # Persistent/API telemetry.
          # ------------------------------------------------------------------
          path = "app/models.py"
          text = read(path)
          anchor = "    latency_seconds: Mapped[float | None] = mapped_column(Float)\n"
          if text.count(anchor) != 1:
              raise SystemExit("model latency anchor changed")
          text = text.replace(
              anchor,
              anchor
              + "    input_tokens: Mapped[int | None] = mapped_column(Integer)\n"
              + "    cached_input_tokens: Mapped[int | None] = mapped_column(Integer)\n"
              + "    reasoning_tokens: Mapped[int | None] = mapped_column(Integer)\n"
              + "    output_tokens: Mapped[int | None] = mapped_column(Integer)\n"
              + "    total_tokens: Mapped[int | None] = mapped_column(Integer)\n",
              1,
          )
          write(path, text)

          path = "app/web/api.py"
          text = read(path)
          anchor = '        "latency_seconds": record.latency_seconds,\n'
          if text.count(anchor) != 1:
              raise SystemExit("API decision latency anchor changed")
          text = text.replace(
              anchor,
              anchor
              + '        "input_tokens": record.input_tokens,\n'
              + '        "cached_input_tokens": record.cached_input_tokens,\n'
              + '        "reasoning_tokens": record.reasoning_tokens,\n'
              + '        "output_tokens": record.output_tokens,\n'
              + '        "total_tokens": record.total_tokens,\n',
              1,
          )
          write(path, text)

          Path("migrations/versions/0027_ai_token_usage.py").write_text(dedent('''\
          """Add provider token/cache usage telemetry to AI decisions.

          Revision ID: 0027_ai_token_usage
          Revises: 0026_ai_latency_trace
          """

          from collections.abc import Sequence

          import sqlalchemy as sa
          from alembic import op

          revision: str = "0027_ai_token_usage"
          down_revision: str | None = "0026_ai_latency_trace"
          branch_labels: str | Sequence[str] | None = None
          depends_on: str | Sequence[str] | None = None


          def upgrade() -> None:
              for column in (
                  "input_tokens",
                  "cached_input_tokens",
                  "reasoning_tokens",
                  "output_tokens",
                  "total_tokens",
              ):
                  op.add_column("ai_decisions", sa.Column(column, sa.Integer(), nullable=True))


          def downgrade() -> None:
              for column in (
                  "total_tokens",
                  "output_tokens",
                  "reasoning_tokens",
                  "cached_input_tokens",
                  "input_tokens",
              ):
                  op.drop_column("ai_decisions", column)
          '''), encoding="utf-8")

          # ------------------------------------------------------------------
          # Regression coverage.
          # ------------------------------------------------------------------
          path = "tests/test_ai_coordinator.py"
          text = read(path)
          text = text.replace(
              "    AiProviderResponse,\n",
              "    AiProviderResponse,\n    AiProviderUsage,\n",
              1,
          )
          text = text.replace(
              '    inputs: list[str] = field(default_factory=list)\n',
              '    inputs: list[str] = field(default_factory=list)\n'
              '    usage: AiProviderUsage | None = None\n',
              1,
          )
          text = text.replace(
              "            model_version=self.model,\n        )",
              "            model_version=self.model,\n            usage=self.usage,\n        )",
              1,
          )
          text = text.replace(
              '        FakeProvider("ok"),\n',
              '        FakeProvider(\n'
              '            "ok",\n'
              '            usage=AiProviderUsage(\n'
              '                input_tokens=1000, cached_input_tokens=750, reasoning_tokens=120,\n'
              '                output_tokens=180, total_tokens=1180,\n'
              '            ),\n'
              '        ),\n',
              1,
          )
          text = text.replace(
              '    bad = next(record for record in records if record.provider == "bad")\n',
              '    ok = next(record for record in records if record.provider == "ok")\n'
              '    assert (ok.input_tokens, ok.cached_input_tokens, ok.reasoning_tokens) == (1000, 750, 120)\n'
              '    assert (ok.output_tokens, ok.total_tokens) == (180, 1180)\n'
              '    bad = next(record for record in records if record.provider == "bad")\n',
              1,
          )
          text = text.replace('assert record.ai_view_version == "ai-view-v4"', 'assert record.ai_view_version == "ai-view-v5"', 1)
          text = text.replace('    assert payload["base_ai_view_version"] == "ai-view-v2"\n', '    assert "base_ai_view_version" not in payload\n', 1)
          text = text.replace('    assert payload["ai_view_version"] == "ai-view-v4"\n', '    assert "ai_view_version" not in payload\n', 1)
          text = text.replace(
              '    assert payload["ai_context_summary"]["context_summary_version"] == "ai-context-summary-v1"\n',
              '    assert "context_summary_version" not in payload["ai_context_summary"]\n'
              '    assert "policy" not in payload["virtual_bankroll"]\n',
              1,
          )
          text = text.replace('    assert records[0].ai_view_version == "ai-view-v4"\n', '    assert records[0].ai_view_version == "ai-view-v5"\n', 1)
          write(path, text)

          path = "tests/test_ai_providers.py"
          text = read(path)
          # Add OpenAI usage to the first mock response and verify cache key/telemetry.
          first_output = '                "output": [\n'
          text = text.replace(
              first_output,
              '                "usage": {\n'
              '                    "input_tokens": 1200,\n'
              '                    "input_tokens_details": {"cached_tokens": 800},\n'
              '                    "output_tokens": 200,\n'
              '                    "output_tokens_details": {"reasoning_tokens": 120},\n'
              '                    "total_tokens": 1400,\n'
              '                },\n'
              + first_output,
              1,
          )
          first_reasoning = '    assert captured["reasoning"] == {"effort": "xhigh"}\n'
          text = text.replace(
              first_reasoning,
              first_reasoning
              + '    assert captured["prompt_cache_key"].startswith("dota-ai-decision:")\n'
              + '    assert result.usage is not None\n'
              + '    assert result.usage.cached_input_tokens == 800\n'
              + '    assert result.usage.reasoning_tokens == 120\n',
              1,
          )
          # DeepSeek inherits the adapter but must not receive an OpenAI-specific cache control.
          last_reasoning = text.rfind(first_reasoning)
          if last_reasoning < 0:
              raise SystemExit("DeepSeek reasoning assertion missing")
          insert_at = last_reasoning + len(first_reasoning)
          text = text[:insert_at] + '    assert "prompt_cache_key" not in captured\n' + text[insert_at:]
          write(path, text)

          Path("tests/test_ai_v5_performance.py").write_text(dedent('''\
          from app.ai.base import (
              PROMPT_VERSION,
              SYSTEM_PROMPT,
              ai_prompt_cache_key,
              extract_provider_usage,
          )


          def test_v5_prompt_preserves_safety_semantics_and_is_compact() -> None:
              assert PROMPT_VERSION == "decision-analyst-v5-performance"
              for phrase in (
                  "UNKNOWN/null",
                  "Deterministic quality blockers",
                  "Never assume Team A is",
                  "not independent evidence",
                  "vig adjustment",
                  "delayed_live_excluded=true",
                  "live_sync",
                  "not independent current evidence",
                  "Simplified Chinese",
                  "stake <= virtual_bankroll.bankroll_before",
              ):
                  assert phrase in SYSTEM_PROMPT
              assert len(SYSTEM_PROMPT) < 5000


          def test_prompt_cache_key_is_stable_per_experiment() -> None:
              first = ai_prompt_cache_key("openai", "gpt-test")
              assert first == ai_prompt_cache_key("openai", "gpt-test")
              assert first != ai_prompt_cache_key("openai", "gpt-other")
              assert first.startswith("dota-ai-decision:")


          def test_usage_extraction_supports_provider_shapes() -> None:
              openai = extract_provider_usage({
                  "usage": {
                      "input_tokens": 1000,
                      "input_tokens_details": {"cached_tokens": 700},
                      "output_tokens": 220,
                      "output_tokens_details": {"reasoning_tokens": 140},
                      "total_tokens": 1220,
                  }
              })
              assert openai is not None
              assert (openai.input_tokens, openai.cached_input_tokens, openai.reasoning_tokens) == (1000, 700, 140)

              anthropic = extract_provider_usage({
                  "usage": {
                      "input_tokens": 200,
                      "cache_creation_input_tokens": 100,
                      "cache_read_input_tokens": 600,
                      "output_tokens": 120,
                  }
              })
              assert anthropic is not None
              assert (anthropic.input_tokens, anthropic.cached_input_tokens) == (900, 600)

              gemini = extract_provider_usage({
                  "usage": {
                      "total_input_tokens": 900,
                      "total_cached_tokens": 650,
                      "total_output_tokens": 180,
                      "total_thought_tokens": 80,
                      "total_tokens": 1160,
                  }
              })
              assert gemini is not None
              assert (gemini.cached_input_tokens, gemini.reasoning_tokens) == (650, 80)

              deepseek = extract_provider_usage({
                  "usage": {
                      "prompt_tokens": 800,
                      "prompt_cache_hit_tokens": 500,
                      "completion_tokens": 200,
                      "completion_tokens_details": {"reasoning_tokens": 110},
                      "total_tokens": 1000,
                  }
              })
              assert deepseek is not None
              assert (deepseek.cached_input_tokens, deepseek.reasoning_tokens) == (500, 110)
          '''), encoding="utf-8")
      - run: uv run ruff format app/ai app/models.py app/web/api.py migrations/versions/0027_ai_token_usage.py tests/test_ai_providers.py tests/test_ai_coordinator.py tests/test_ai_v5_performance.py
      - run: uv run ruff check app/ai app/models.py app/web/api.py migrations/versions/0027_ai_token_usage.py tests/test_ai_providers.py tests/test_ai_coordinator.py tests/test_ai_v5_performance.py
      - name: Run focused backend tests
        run: uv run pytest tests/test_ai_providers.py tests/test_ai_coordinator.py tests/test_ai_v5_performance.py tests/test_web_api_contract.py
      - name: Commit patch
