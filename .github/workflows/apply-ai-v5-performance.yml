name: Apply AI decision v5 performance patch

on:
  push:
    branches:
      - perf/ai-decision-v5

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/ai-decision-v5
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          python-version: "3.14"
      - run: uv sync --frozen --extra dev
      - name: Apply v5 performance patch
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              text = read(path)
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"missing patch target {path}: {old!r} (found {actual})")
              write(path, text.replace(old, new, count))

          # ---- Prompt + provider usage helpers ---------------------------------
          path = "app/ai/base.py"
          text = read(path)
          text = text.replace("from dataclasses import dataclass\n", "import hashlib\nfrom dataclasses import dataclass\n", 1)
          text = text.replace(
              'PROMPT_VERSION = "decision-analyst-v4"',
              'PROMPT_VERSION = "decision-analyst-v5-performance"',
              1,
          )
          prompt = '''SYSTEM_PROMPT = """You are an independent Dota 2 decision analyst.
          Use only the supplied immutable DecisionSnapshot-derived AI input. Never browse, call
          tools, invent facts, or resolve UNKNOWN/null values yourself. Deterministic quality
          blockers override model judgment; NO_BUY and INSUFFICIENT_DATA are normal outcomes.

          Assess Team A versus Team B exactly as identified by the input. Never assume Team A is
          Radiant or Team B is Dire. Use side-relative evidence only when upstream side identity
          is RESOLVED.

          Decision/output rules:
          - Follow the schema-defined decision semantics without changing their meaning.
          - BUY_A/BUY_B require 0 < stake <= virtual_bankroll.bankroll_before.
            NO_BUY/INSUFFICIENT_DATA use stake null/0. Stake is virtual audit capital only.
          - Include concise primary reasons, counter-arguments, data-quality concerns, and
            blockers; use at most three concise strings per explanatory list.
          - Reasons must cite relevant AI-input paths.
          - All descriptive strings must be clear professional Simplified Chinese. Enum literals
            remain the schema-defined uppercase English values.

          Evidence rules:
          - ai_context_summary is deterministic compression of market/draft/history/live/quality,
            not independent evidence. Use it to orient analysis, never double-count it. If summary
            and raw blocks disagree, raw evidence wins and the mismatch is a quality concern.
          - market_signal.favorite is only the direction of vig-removed market probability, not a
            model forecast or mispricing signal. team_a_vig_adjustment_pp is mechanical vig
            adjustment, never evidence of undervaluation.
          - Positive Team-A-relative draft/history/live deltas or edges favor A; negative values
            favor B. Historical comparisons are comparative evidence, not guaranteed causal effects.
          - signal_agreement is directional consistency only. CONSISTENT does not strengthen
            duplicated evidence; DIVERGENT warrants scrutiny.
          - odds_drift is Team A implied-probability movement. The market is real-time and may
            already price events absent from the live block.
          - team_a_nw_lead/team_a_nw_delta and trend_windows describe observed state/momentum, not
            causality. buildings_lost and economy_trajectory are state/context; barracks losses
            imply megacreep risk.
          - draft_live_agreement DIVERGENT warrants scrutiny. Respect position_source,
            position_confidence, player_stats observed_at, and draft bans as evidence provenance.
          - live_data_lag_minutes compares delayed live/player data with the real-time market. If
            delayed_live_excluded=true, do not infer withheld live state, trend, buildings,
            economy, or player stats.
          - knowledge_cutoff, observed_at, and statistics_cutoff define freshness. live_sync
            UNKNOWN/CALIBRATING means live alignment may be delayed and should reduce confidence.

          Prior decisions:
          prior_decisions are your own earlier decisions for this match, oldest first. Use them
          only for continuity and calibration, never as independent current evidence. New evidence
          may change the conclusion; do not blindly repeat stale reasoning or chase previous losses.
          """'''
          pattern = re.compile(
              r'SYSTEM_PROMPT = """.*?"""\n\n\n@dataclass\(frozen=True\)\nclass AiProviderResponse:',
              re.S,
          )
          replacement = prompt + '''\n\n\n@dataclass(frozen=True)\nclass AiProviderUsage:\n    input_tokens: int | None = None\n    cached_input_tokens: int | None = None\n    reasoning_tokens: int | None = None\n    output_tokens: int | None = None\n    total_tokens: int | None = None\n\n\n@dataclass(frozen=True)\nclass AiProviderResponse:'''
          text, changed = pattern.subn(replacement, text, count=1)
          if changed != 1:
              raise SystemExit("failed to replace SYSTEM_PROMPT block")
          text = text.replace(
              "    model_version: str\n\n\nclass AiProviderFailure",
              "    model_version: str\n    usage: AiProviderUsage | None = None\n\n\n"
              "def ai_prompt_cache_key(provider: str, model: str) -> str:\n"
              "    identity = '|'.join(ai_experiment_key(provider, model))\n"
              "    digest = hashlib.sha256(identity.encode('utf-8')).hexdigest()[:32]\n"
              "    return f'dota-ai-decision:{digest}'\n\n\n"
              "def extract_provider_usage(payload: dict[str, Any] | None) -> AiProviderUsage | None:\n"
              "    if not isinstance(payload, dict):\n"
              "        return None\n"
              "    usage = payload.get('usage')\n"
              "    if not isinstance(usage, dict):\n"
              "        return None\n\n"
              "    input_details = usage.get('input_tokens_details')\n"
              "    output_details = usage.get('output_tokens_details')\n"
              "    completion_details = usage.get('completion_tokens_details')\n"
              "    input_details = input_details if isinstance(input_details, dict) else {}\n"
              "    output_details = output_details if isinstance(output_details, dict) else {}\n"
              "    completion_details = (\n"
              "        completion_details if isinstance(completion_details, dict) else {}\n"
              "    )\n\n"
              "    cache_read = _usage_int(usage.get('cache_read_input_tokens'))\n"
              "    cache_creation = _usage_int(usage.get('cache_creation_input_tokens'))\n"
              "    input_tokens = _first_usage_int(\n"
              "        usage.get('total_input_tokens'),\n"
              "        usage.get('input_tokens'),\n"
              "        usage.get('prompt_tokens'),\n"
              "    )\n"
              "    if cache_read is not None or cache_creation is not None:\n"
              "        input_tokens = (\n"
              "            (_usage_int(usage.get('input_tokens')) or 0)\n"
              "            + (cache_read or 0)\n"
              "            + (cache_creation or 0)\n"
              "        )\n"
              "    cached_input_tokens = _first_usage_int(\n"
              "        usage.get('total_cached_tokens'),\n"
              "        input_details.get('cached_tokens'),\n"
              "        usage.get('prompt_cache_hit_tokens'),\n"
              "        cache_read,\n"
              "    )\n"
              "    output_tokens = _first_usage_int(\n"
              "        usage.get('total_output_tokens'),\n"
              "        usage.get('output_tokens'),\n"
              "        usage.get('completion_tokens'),\n"
              "    )\n"
              "    reasoning_tokens = _first_usage_int(\n"
              "        usage.get('total_thought_tokens'),\n"
              "        output_details.get('reasoning_tokens'),\n"
              "        completion_details.get('reasoning_tokens'),\n"
              "    )\n"
              "    total_tokens = _usage_int(usage.get('total_tokens'))\n"
              "    if total_tokens is None and input_tokens is not None and output_tokens is not None:\n"
              "        total_tokens = input_tokens + output_tokens\n"
              "    if all(\n"
              "        value is None\n"
              "        for value in (\n"
              "            input_tokens,\n"
              "            cached_input_tokens,\n"
              "            reasoning_tokens,\n"
              "            output_tokens,\n"
              "            total_tokens,\n"
              "        )\n"
              "    ):\n"
              "        return None\n"
              "    return AiProviderUsage(\n"
              "        input_tokens=input_tokens,\n"
              "        cached_input_tokens=cached_input_tokens,\n"
              "        reasoning_tokens=reasoning_tokens,\n"
              "        output_tokens=output_tokens,\n"
              "        total_tokens=total_tokens,\n"
              "    )\n\n\n"
              "def _first_usage_int(*values: object) -> int | None:\n"
              "    for value in values:\n"
              "        parsed = _usage_int(value)\n"
              "        if parsed is not None:\n"
              "            return parsed\n"
              "    return None\n\n\n"
              "def _usage_int(value: object) -> int | None:\n"
              "    if isinstance(value, bool):\n"
              "        return None\n"
              "    if isinstance(value, int) and value >= 0:\n"
              "        return value\n"
              "    if isinstance(value, float) and value >= 0 and value.is_integer():\n"
              "        return int(value)\n"
              "    return None\n\n\n"
              "class AiProviderFailure",
              1,
          )
          write(path, text)

          # ---- Provider-facing AI view: omit audit-only version labels ---------
          path = "app/ai/input.py"
          text = read(path)
          text = text.replace('AI_VIEW_VERSION = "ai-view-v4"', 'AI_VIEW_VERSION = "ai-view-v5"', 1)
          old = '''    return {
              **view,
              "base_ai_view_version": view.get("ai_view_version"),
              "ai_view_version": AI_VIEW_VERSION,
              "ai_context_summary": build_ai_context_summary(view),
          }
          '''
          new = '''    summary = build_ai_context_summary(view)
          # Version labels are audit identity, not match evidence. They remain stored on
          # AiDecisionRecord/ai_input_hash but do not consume provider context tokens.
          provider_view = {key: value for key, value in view.items() if key != "ai_view_version"}
          provider_summary = {
              key: value for key, value in summary.items() if key != "context_summary_version"
          }
          return {
              **provider_view,
              "ai_context_summary": provider_summary,
          }
          '''
          if old not in text:
              raise SystemExit("input.py return block changed unexpectedly")
          write(path, text.replace(old, new, 1))

          # ---- Provider request/usage plumbing ----------------------------------
          path = "app/ai/openai.py"
          text = read(path)
          text = text.replace(
              "    AiProviderResponse,\n    decision_json_schema,\n    parse_decision,\n",
              "    AiProviderResponse,\n    ai_prompt_cache_key,\n    decision_json_schema,\n    extract_provider_usage,\n    parse_decision,\n",
              1,
          )
          old = '''        response = await self._client.post(
              "/responses",
              json={
                  "model": self.model,
                  "reasoning": {"effort": self.reasoning_effort},
                  "instructions": SYSTEM_PROMPT,
                  "input": snapshot_input,
                  "text": {
                      "format": {
                          "type": "json_schema",
                          "name": "dota_ai_decision",
                          "schema": decision_json_schema(),
                          "strict": True,
                      }
                  },
              },
          )
          '''
          new = '''        payload: dict[str, Any] = {
              "model": self.model,
              "reasoning": {"effort": self.reasoning_effort},
              "instructions": SYSTEM_PROMPT,
              "input": snapshot_input,
              "text": {
                  "format": {
                      "type": "json_schema",
                      "name": "dota_ai_decision",
                      "schema": decision_json_schema(),
                      "strict": True,
                  }
              },
          }
          # OpenAI Responses supports an explicit stable prompt cache key. Keep
          # OpenAI-compatible/local providers untouched because they may reject it.
          if self.name == "openai":
              payload["prompt_cache_key"] = ai_prompt_cache_key(self.name, self.model)
          response = await self._client.post("/responses", json=payload)
          '''
          if old not in text:
              raise SystemExit("openai request block changed unexpectedly")
          text = text.replace(old, new, 1)
          text = text.replace(
              "            model_version=str(raw.get(\"model\") or self.model),\n        )",
              "            model_version=str(raw.get(\"model\") or self.model),\n"
              "            usage=extract_provider_usage(raw),\n        )",
              1,
          )
          write(path, text)

          for path, marker in [
              ("app/ai/anthropic.py", "decision_json_schema,"),
              ("app/ai/gemini.py", "decision_json_schema,"),
          ]:
              text = read(path)
              text = text.replace(
                  f"    {marker}\n    parse_decision,\n",
                  f"    {marker}\n    extract_provider_usage,\n    parse_decision,\n",
                  1,
              )
              text = text.replace(
                  "            model_version=str(raw.get(\"model\") or self.model),\n        )",
                  "            model_version=str(raw.get(\"model\") or self.model),\n"
                  "            usage=extract_provider_usage(raw),\n        )",
                  1,
              )
              write(path, text)

          path = "app/ai/chat_completions.py"
          text = read(path)
          text = text.replace(
              "    AiProviderResponse,\n    parse_decision,\n",
              "    AiProviderResponse,\n    extract_provider_usage,\n    parse_decision,\n",
              1,
          )
          text = text.replace(
              "            model_version=str(raw.get(\"model\") or self.model),\n        )",
              "            model_version=str(raw.get(\"model\") or self.model),\n"
              "            usage=extract_provider_usage(raw),\n        )",
              1,
          )
          write(path, text)

          # ---- Persist token/cache telemetry and remove duplicate bankroll prose -
          path = "app/ai/coordinator.py"
          text = read(path)
          text = text.replace(
              "    ai_experiment_key,\n    validate_ai_decision,\n",
              "    ai_experiment_key,\n    extract_provider_usage,\n    validate_ai_decision,\n",
              1,
          )
          text = text.replace(
              "        model_version = prepared.provider.model\n        received_at = None\n",
              "        model_version = prepared.provider.model\n        usage = None\n        received_at = None\n",
              1,
          )
          text = text.replace(
              "            raw_response = result.raw_response\n            validate_ai_decision(\n",
              "            raw_response = result.raw_response\n            usage = result.usage\n            validate_ai_decision(\n",
              1,
          )
          text = text.replace(
              "            raw_response = exc.raw_response\n            parse_status = exc.parse_status\n",
              "            raw_response = exc.raw_response\n            usage = extract_provider_usage(raw_response)\n            parse_status = exc.parse_status\n",
              1,
          )
          text = text.replace(
              "            latency_seconds=perf_counter() - started_clock,\n            raw_response=",
              "            latency_seconds=perf_counter() - started_clock,\n"
              "            input_tokens=usage.input_tokens if usage is not None else None,\n"
              "            cached_input_tokens=(\n"
              "                usage.cached_input_tokens if usage is not None else None\n"
              "            ),\n"
              "            reasoning_tokens=usage.reasoning_tokens if usage is not None else None,\n"
              "            output_tokens=usage.output_tokens if usage is not None else None,\n"
              "            total_tokens=usage.total_tokens if usage is not None else None,\n"
              "            raw_response=",
              1,
          )
          policy = '''            "units": "virtual-units",
              "policy": (
                  "Independent virtual shadow bankroll for this provider/model and match. "
                  "BUY_A/BUY_B require 0 < stake <= bankroll_before; other actions require "
                  "stake null/0. No real money and no automatic execution."
              ),
          '''
          if policy not in text:
              raise SystemExit("bankroll policy block changed unexpectedly")
          text = text.replace(policy, '            "units": "virtual-units",\n', 1)
          write(path, text)

          # ---- DB model + migration --------------------------------------------
          path = "app/models.py"
          text = read(path)
          anchor = "    latency_seconds: Mapped[float | None] = mapped_column(Float)\n"
          addition = anchor + (
              "    input_tokens: Mapped[int | None] = mapped_column(Integer)\n"
              "    cached_input_tokens: Mapped[int | None] = mapped_column(Integer)\n"
              "    reasoning_tokens: Mapped[int | None] = mapped_column(Integer)\n"
              "    output_tokens: Mapped[int | None] = mapped_column(Integer)\n"
              "    total_tokens: Mapped[int | None] = mapped_column(Integer)\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit("unexpected latency_seconds model anchor")
          write(path, text.replace(anchor, addition, 1))

          migration = Path("migrations/versions/0027_ai_token_usage.py")
          migration.write_text('''"""Add provider token/cache usage telemetry to AI decisions.

          Revision ID: 0027_ai_token_usage
          Revises: 0026_ai_latency_trace
          """

          from collections.abc import Sequence

          import sqlalchemy as sa
          from alembic import op

          revision: str = "0027_ai_token_usage"
          down_revision: str | None = "0026_ai_latency_trace"
          branch_labels: str | Sequence[str] | None = None
          depends_on: str | Sequence[str] | None = None


          def upgrade() -> None:
              for column in (
                  "input_tokens",
                  "cached_input_tokens",
                  "reasoning_tokens",
                  "output_tokens",
                  "total_tokens",
              ):
                  op.add_column("ai_decisions", sa.Column(column, sa.Integer(), nullable=True))


          def downgrade() -> None:
              for column in (
                  "total_tokens",
                  "output_tokens",
                  "reasoning_tokens",
                  "cached_input_tokens",
                  "input_tokens",
              ):
                  op.drop_column("ai_decisions", column)
          ''', encoding="utf-8")

          # ---- Provider tests ----------------------------------------------------
          path = "tests/test_ai_providers.py"
          text = read(path)
          text = text.replace(
              '                "output": [\n',
              '                "usage": {\n'
              '                    "input_tokens": 1200,\n'
              '                    "input_tokens_details": {"cached_tokens": 800},\n'
              '                    "output_tokens": 200,\n'
              '                    "output_tokens_details": {"reasoning_tokens": 120},\n'
              '                    "total_tokens": 1400,\n'
              '                },\n'
              '                "output": [\n',
              1,
          )
          text = text.replace(
              '    assert captured["reasoning"] == {"effort": "xhigh"}\n',
              '    assert captured["reasoning"] == {"effort": "xhigh"}\n'
              '    assert captured["prompt_cache_key"].startswith("dota-ai-decision:")\n'
              '    assert result.usage is not None\n'
              '    assert result.usage.input_tokens == 1200\n'
              '    assert result.usage.cached_input_tokens == 800\n'
              '    assert result.usage.reasoning_tokens == 120\n',
              1,
          )
          # Anthropic cache usage shape: input_tokens excludes cached/cache-creation tokens.
          text = text.replace(
              '                "content": [{"type": "text", "text": json.dumps(DECISION)}],\n',
              '                "content": [{"type": "text", "text": json.dumps(DECISION)}],\n'
              '                "usage": {\n'
              '                    "input_tokens": 300,\n'
              '                    "cache_creation_input_tokens": 100,\n'
              '                    "cache_read_input_tokens": 600,\n'
              '                    "output_tokens": 150,\n'
              '                },\n',
              1,
          )
          text = text.replace(
              '    assert captured["output_config"]["format"]["type"] == "json_schema"\n',
              '    assert captured["output_config"]["format"]["type"] == "json_schema"\n'
              '    assert result.usage is not None\n'
              '    assert result.usage.input_tokens == 1000\n'
              '    assert result.usage.cached_input_tokens == 600\n',
              1,
          )
          # Gemini Interactions usage names.
          gemini_marker = '                "model": "gemini-3.6-flash",\n                "steps": [\n'
          text = text.replace(
              gemini_marker,
              '                "model": "gemini-3.6-flash",\n'
              '                "usage": {\n'
              '                    "total_input_tokens": 900,\n'
              '                    "total_cached_tokens": 700,\n'
              '                    "total_output_tokens": 180,\n'
              '                    "total_thought_tokens": 90,\n'
              '                    "total_tokens": 1170,\n'
              '                },\n'
              '                "steps": [\n',
              1,
          )
          text = text.replace(
              '    assert captured["input"] == \'{"snapshot_hash":"same"}\'\n',
              '    assert captured["input"] == \'{"snapshot_hash":"same"}\'\n'
              '    assert result.usage is not None\n'
              '    assert result.usage.cached_input_tokens == 700\n'
              '    assert result.usage.reasoning_tokens == 90\n',
              1,
          )
          # The second xhigh assertion belongs to DeepSeek; ensure OpenAI-only key is absent.
          deepseek_assert = '    assert captured["reasoning"] == {"effort": "xhigh"}\n    assert captured["input"] == \'{"snapshot_hash":"same"}\'\n'
          text = text.replace(
              deepseek_assert,
              '    assert captured["reasoning"] == {"effort": "xhigh"}\n'
              '    assert "prompt_cache_key" not in captured\n'
              '    assert captured["input"] == \'{"snapshot_hash":"same"}\'\n',
              1,
          )
          write(path, text)

          # ---- Coordinator tests: audit metadata omitted, usage persisted --------
          path = "tests/test_ai_coordinator.py"
          text = read(path)
          text = text.replace(
              "    AiProviderFailure,\n    AiProviderResponse,\n",
              "    AiProviderFailure,\n    AiProviderResponse,\n    AiProviderUsage,\n",
              1,
          )
          text = text.replace(
              '    inputs: list[str] = field(default_factory=list)\n',
              '    inputs: list[str] = field(default_factory=list)\n'
              '    usage: AiProviderUsage | None = None\n',
              1,
          )
          text = text.replace(
              "            model_version=self.model,\n        )",
              "            model_version=self.model,\n            usage=self.usage,\n        )",
              1,
          )
          text = text.replace(
              '        FakeProvider("ok"),\n',
              '        FakeProvider(\n'
              '            "ok",\n'
              '            usage=AiProviderUsage(\n'
              '                input_tokens=1000,\n'
              '                cached_input_tokens=750,\n'
              '                reasoning_tokens=120,\n'
              '                output_tokens=180,\n'
              '                total_tokens=1180,\n'
              '            ),\n'
              '        ),\n',
              1,
          )
          text = text.replace(
              '    bad = next(record for record in records if record.provider == "bad")\n',
              '    ok = next(record for record in records if record.provider == "ok")\n'
              '    assert ok.input_tokens == 1000\n'
              '    assert ok.cached_input_tokens == 750\n'
              '    assert ok.reasoning_tokens == 120\n'
              '    assert ok.output_tokens == 180\n'
              '    assert ok.total_tokens == 1180\n'
              '    bad = next(record for record in records if record.provider == "bad")\n',
              1,
          )
          text = text.replace('assert record.ai_view_version == "ai-view-v4"', 'assert record.ai_view_version == "ai-view-v5"', 1)
          old = '''    payload = json.loads(provider.inputs[0])
              assert payload["base_ai_view_version"] == "ai-view-v2"
              assert payload["ai_view_version"] == "ai-view-v4"
              assert payload["ai_context_summary"]["context_summary_version"] == "ai-context-summary-v1"
              assert payload["ai_context_summary"]["market_signal"]["favorite"] == "A"
              assert records[0].ai_view_version == "ai-view-v4"
          '''
          new = '''    payload = json.loads(provider.inputs[0])
              assert "base_ai_view_version" not in payload
              assert "ai_view_version" not in payload
              assert "context_summary_version" not in payload["ai_context_summary"]
              assert "policy" not in payload["virtual_bankroll"]
              assert payload["ai_context_summary"]["market_signal"]["favorite"] == "A"
              assert records[0].ai_view_version == "ai-view-v5"
          '''
          if old not in text:
              raise SystemExit("coordinator provider-input assertions changed unexpectedly")
          write(path, text.replace(old, new, 1))

          # ---- Compact-prompt semantic guard ------------------------------------
          Path("tests/test_ai_prompt_performance.py").write_text('''from app.ai.base import PROMPT_VERSION, SYSTEM_PROMPT


          def test_v5_performance_prompt_preserves_decision_safety_semantics() -> None:
              assert PROMPT_VERSION == "decision-analyst-v5-performance"
              required = (
                  "UNKNOWN/null",
                  "Deterministic quality blockers",
                  "Never assume Team A is",
                  "ai_context_summary",
                  "not independent evidence",
                  "vig adjustment",
                  "delayed_live_excluded=true",
                  "live_sync",
                  "prior_decisions",
                  "not independent current evidence",
                  "Simplified Chinese",
                  "stake <= virtual_bankroll.bankroll_before",
              )
              for phrase in required:
                  assert phrase in SYSTEM_PROMPT


          def test_v5_performance_prompt_is_materially_smaller_than_v4_budget() -> None:
              # Character budget is deliberately loose: it guards accidental glossary
