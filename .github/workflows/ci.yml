name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  autofix:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-access-runtime-boundaries'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Apply reviewed source fixups
        shell: python
        run: |
          from pathlib import Path

          api = Path("app/web/api.py")
          text = api.read_text(encoding="utf-8")
          old = '''    if result is not None:
              return "POSTMATCH" if _confirmed_result(result) else "AWAITING_RESULT"
          if live is not None:
              message_age = elapsed_seconds(observed_at, live.last_message_received_at)
              if 0 <= message_age <= live_state_max_age_seconds:
                  return "LIVE"
              return "AWAITING_RESULT"
          if scheduled_at is not None and ensure_utc(scheduled_at) >= ensure_utc(observed_at):
              return "PREMATCH"
          return "UNKNOWN"
          '''
          new = '''    if _confirmed_result(result):
              return "POSTMATCH"
          if live is not None:
              message_age = elapsed_seconds(observed_at, live.last_message_received_at)
              if 0 <= message_age <= live_state_max_age_seconds:
                  return "LIVE"
              return "AWAITING_RESULT"
          if result is not None:
              return "AWAITING_RESULT"
          if scheduled_at is not None and ensure_utc(scheduled_at) >= ensure_utc(observed_at):
              return "PREMATCH"
          return "UNKNOWN"
          '''
          if old not in text:
              raise SystemExit("expected _match_phase block was not found")
          api.write_text(text.replace(old, new, 1), encoding="utf-8")

          admin = Path("frontend/src/components/AdminRuntimePage.tsx")
          text = admin.read_text(encoding="utf-8")
          old = 'onClick={() => provider.api_key_secret_key && void onSecret(provider.api_key_secret_key, secret)}'
          new = 'onClick={() => { if (!provider.api_key_secret_key || !secret) return; const value = secret; setSecret(""); void onSecret(provider.api_key_secret_key, value); }}'
          if old not in text:
              raise SystemExit("expected ProviderEditor secret handler was not found")
          admin.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Format Python
        run: uv run ruff format app/web/api.py app/web/feature_flags.py tests/test_security_boundary_regressions.py tests/test_match_phase.py
      - name: Push fixups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/api.py app/web/feature_flags.py tests/test_security_boundary_regressions.py tests/test_match_phase.py frontend/src/components/AdminRuntimePage.tsx
          git diff --cached --check
          git commit -m "Apply reviewed runtime boundary fixups"
          git push origin HEAD:${{ github.head_ref }}

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: dota_ai_decision_lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dota_ai_decision_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/dota_ai_decision_lab
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run python tools/scan_git_history_secrets.py
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run ruff format --check app migrations tests tools
      - run: uv run ruff check app migrations tests tools
      - run: uv run ruff check --select S app migrations tools
      - run: uv run pytest -W error

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
