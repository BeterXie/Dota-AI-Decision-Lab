name: Apply AI decision v5 performance patch v4

on:
  push:
    branches:
      - perf/ai-decision-v5

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/ai-decision-v5
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          python-version: "3.14"
      - run: uv sync --frozen --extra dev
      - name: Execute v3 patch with corrected generated indentation
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/apply-ai-v5-performance-v3.yml').read_text(encoding='utf-8'))
          source = next(
              step['run']
              for step in workflow['jobs']['patch']['steps']
              if step.get('name') == 'Apply anchored edits'
          )
          source = source.replace('from textwrap import dedent', 'from textwrap import dedent, indent', 1)

          source = source.replace("new_return = dedent('''\\\n", "new_return = indent(dedent('''\\\n", 1)
          marker = 'text = text[:start] + new_return + text[end:]'
          end = source.index(marker)
          close = source.rfind("''')", 0, end)
          source = source[:close] + "'''), '    ')" + source[close + 4:]

          source = source.replace("request = dedent('''\\\n", "request = indent(dedent('''\\\n", 1)
          marker = 'text = text[:start] + request + text[end:]'
          end = source.index(marker)
          close = source.rfind("''')", 0, end)
          source = source[:close] + "'''), '        ')" + source[close + 4:]

          patch_file = Path('/tmp/apply_ai_v5_perf_v4.py')
          patch_file.write_text(source, encoding='utf-8')
          subprocess.run(['python', str(patch_file)], check=True)
      - run: uv run ruff format app/ai app/models.py app/web/api.py migrations/versions/0027_ai_token_usage.py tests/test_ai_providers.py tests/test_ai_coordinator.py tests/test_ai_v5_performance.py
      - run: uv run ruff check app/ai app/models.py app/web/api.py migrations/versions/0027_ai_token_usage.py tests/test_ai_providers.py tests/test_ai_coordinator.py tests/test_ai_v5_performance.py
      - name: Run focused backend tests
        run: uv run pytest tests/test_ai_providers.py tests/test_ai_coordinator.py tests/test_ai_v5_performance.py tests/test_web_api_contract.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ai app/models.py app/web/api.py migrations/versions/0027_ai_token_usage.py tests/test_ai_providers.py tests/test_ai_coordinator.py tests/test_ai_v5_performance.py
          git commit -m "perf(ai): add v5 prompt and token cache telemetry"
          git push origin HEAD:perf/ai-decision-v5
