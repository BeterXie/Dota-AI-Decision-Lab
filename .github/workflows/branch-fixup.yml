name: Branch fixup

on:
  push:
    branches:
      - agent/fix-access-runtime-boundaries

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Apply reviewed source fixups
        shell: python
        run: |
          from pathlib import Path

          api = Path("app/web/api.py")
          text = api.read_text(encoding="utf-8")
          old = '''    if result is not None:
              return "POSTMATCH" if _confirmed_result(result) else "AWAITING_RESULT"
          if live is not None:
              message_age = elapsed_seconds(observed_at, live.last_message_received_at)
              if 0 <= message_age <= live_state_max_age_seconds:
                  return "LIVE"
              return "AWAITING_RESULT"
          if scheduled_at is not None and ensure_utc(scheduled_at) >= ensure_utc(observed_at):
              return "PREMATCH"
          return "UNKNOWN"
          '''
          new = '''    if _confirmed_result(result):
              return "POSTMATCH"
          if live is not None:
              message_age = elapsed_seconds(observed_at, live.last_message_received_at)
              if 0 <= message_age <= live_state_max_age_seconds:
                  return "LIVE"
              return "AWAITING_RESULT"
          if result is not None:
              return "AWAITING_RESULT"
          if scheduled_at is not None and ensure_utc(scheduled_at) >= ensure_utc(observed_at):
              return "PREMATCH"
          return "UNKNOWN"
          '''
          if old not in text:
              raise SystemExit("expected _match_phase block was not found")
          api.write_text(text.replace(old, new, 1), encoding="utf-8")

          admin = Path("frontend/src/components/AdminRuntimePage.tsx")
          text = admin.read_text(encoding="utf-8")
          old = 'onClick={() => provider.api_key_secret_key && void onSecret(provider.api_key_secret_key, secret)}'
          new = 'onClick={() => { if (!provider.api_key_secret_key || !secret) return; const value = secret; setSecret(""); void onSecret(provider.api_key_secret_key, value); }}'
          if old not in text:
              raise SystemExit("expected ProviderEditor secret handler was not found")
          admin.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Ruff format reviewed Python files
        run: uv run ruff format app/web/api.py app/web/feature_flags.py tests/test_security_boundary_regressions.py
      - name: Commit fixups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/api.py app/web/feature_flags.py tests/test_security_boundary_regressions.py frontend/src/components/AdminRuntimePage.tsx
          git diff --cached --check
          git commit -m "Apply reviewed runtime boundary fixups"
          git push origin HEAD:agent/fix-access-runtime-boundaries
