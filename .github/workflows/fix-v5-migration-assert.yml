name: Fix v5 migration assertion

on:
  push:
    branches:
      - perf/ai-decision-v5

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/ai-decision-v5
      - name: Update expected migration head
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/test_production_lifecycle_replay.py")
          text = path.read_text(encoding="utf-8")
          old = 'assert revision == "0026_ai_latency_trace"'
          new = 'assert revision == "0027_ai_token_usage"'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one old migration assertion, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_production_lifecycle_replay.py
          git commit -m "test: update lifecycle migration head"
          git push origin HEAD:perf/ai-decision-v5
