name: Apply AI output simplification v2

on:
  push:
    branches:
      - perf/ai-output-simplification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/ai-output-simplification
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev
      - name: Apply product patch
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/apply-ai-output-simplification.yml').read_text(encoding='utf-8')
          )
          source = next(
              step['run']
              for step in workflow['jobs']['patch']['steps']
              if step.get('name') == 'Apply schema and presentation changes'
          )
          runner = Path('/tmp/apply_ai_output_patch.py')
          runner.write_text(source, encoding='utf-8')
          subprocess.run(['uv', 'run', 'python', str(runner)], check=True)
          PY
      - name: Format and lint backend
        run: |
          uv run ruff format app/ai app/domain/decision.py app/notifications tests/test_ai_providers.py tests/test_ai_coordinator.py tests/test_ai_v5_performance.py tests/test_email_notifications.py
          uv run ruff check --fix app/ai app/domain/decision.py app/notifications tests/test_ai_providers.py tests/test_ai_coordinator.py tests/test_ai_v5_performance.py tests/test_email_notifications.py
          uv run ruff format app/ai app/domain/decision.py app/notifications tests/test_ai_providers.py tests/test_ai_coordinator.py tests/test_ai_v5_performance.py tests/test_email_notifications.py
          uv run ruff check app/ai app/domain/decision.py app/notifications tests/test_ai_providers.py tests/test_ai_coordinator.py tests/test_ai_v5_performance.py tests/test_email_notifications.py
      - name: Run focused backend tests
        run: uv run pytest tests/test_ai_providers.py tests/test_ai_coordinator.py tests/test_ai_v5_performance.py tests/test_ai_decision_integrity.py tests/test_email_notifications.py tests/test_backtest.py tests/test_virtual_pnl.py
      - name: Run frontend unit tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app docs frontend tests
          git commit -m "perf(ai): stop emitting verbose explanation lists"
          git push origin HEAD:perf/ai-output-simplification
