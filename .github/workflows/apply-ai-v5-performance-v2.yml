name: Apply AI decision v5 performance patch v2

on:
  push:
    branches:
      - perf/ai-decision-v5

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/ai-decision-v5
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          python-version: "3.14"
      - run: uv sync --frozen --extra dev
      - name: Reuse patch script with robust input-view replacement
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/apply-ai-v5-performance.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['patch']['steps']
          source = next(step['run'] for step in steps if step.get('name') == 'Apply v5 performance patch')

          start_marker = '# ---- Provider-facing AI view: omit audit-only version labels ---------'
          end_marker = '# ---- Provider request/usage plumbing ----------------------------------'
          start = source.index(start_marker)
          end = source.index(end_marker)
          replacement = '''# ---- Provider-facing AI view: omit audit-only version labels ---------
          path = "app/ai/input.py"
          text = read(path)
          text = text.replace('AI_VIEW_VERSION = "ai-view-v4"', 'AI_VIEW_VERSION = "ai-view-v5"', 1)
          pattern = re.compile(
              r'    return \\{\\n'
              r'        \\*\\*view,\\n'
              r'        "base_ai_view_version": view\\.get\\("ai_view_version"\\),\\n'
              r'        "ai_view_version": AI_VIEW_VERSION,\\n'
              r'        "ai_context_summary": build_ai_context_summary\\(view\\),\\n'
              r'    \\}\\n'
          )
          new = ''' + '"""' + '''    summary = build_ai_context_summary(view)
          # Version labels are audit identity, not match evidence. They remain stored on
          # AiDecisionRecord/ai_input_hash but do not consume provider context tokens.
          provider_view = {key: value for key, value in view.items() if key != "ai_view_version"}
          provider_summary = {
              key: value for key, value in summary.items() if key != "context_summary_version"
          }
          return {
              **provider_view,
              "ai_context_summary": provider_summary,
          }
          ''' + '"""' + '''
          text, changed = pattern.subn(new, text, count=1)
          if changed != 1:
              raise SystemExit("input.py return block changed unexpectedly")
          write(path, text)

          '''
          corrected = source[:start] + replacement + source[end:]
          patch_file = Path('/tmp/apply_ai_v5_perf.py')
          patch_file.write_text(corrected, encoding='utf-8')
          subprocess.run(['python', str(patch_file)], check=True)
      - run: uv run ruff format app/ai app/models.py migrations/versions/0027_ai_token_usage.py tests/test_ai_providers.py tests/test_ai_coordinator.py tests/test_ai_prompt_performance.py
      - name: Run focused backend tests
        run: uv run pytest tests/test_ai_providers.py tests/test_ai_coordinator.py tests/test_ai_prompt_performance.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ai app/models.py migrations/versions/0027_ai_token_usage.py tests/test_ai_providers.py tests/test_ai_coordinator.py tests/test_ai_prompt_performance.py
          git commit -m "perf(ai): add v5 prompt and token cache telemetry"
          git push origin HEAD:perf/ai-decision-v5
