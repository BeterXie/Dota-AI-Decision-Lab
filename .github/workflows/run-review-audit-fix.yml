name: Run review audit fix

on:
  push:
    branches: [fix/review-audit-contracts]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/review-audit-contracts
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply patch
        run: python tools/_apply_review_audit_fix.py
      - name: Validate backend
        run: |
          uv sync --frozen --extra dev
          uv run ruff format app/ai/eligibility.py app/web/review.py app/web/api.py app/web/__init__.py app/main.py tests/test_review_api.py tests/test_ai_eligibility.py
          uv run ruff check app/ai/eligibility.py app/web/review.py app/web/api.py app/web/__init__.py app/main.py tests/test_review_api.py tests/test_ai_eligibility.py
          uv run pytest tests/test_review_api.py tests/test_ai_eligibility.py
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
          npm run build
      - name: Remove patch plumbing and commit
        run: |
          rm tools/_apply_review_audit_fix.py
          rm .github/workflows/apply-review-audit-fixes.yml
          rm .github/workflows/run-review-audit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(review): enforce auditable review contracts"
          git push origin HEAD:fix/review-audit-contracts
