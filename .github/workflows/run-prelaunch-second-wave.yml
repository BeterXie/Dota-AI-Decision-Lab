name: Validate prelaunch second-wave hardening

on:
  push:
    branches: [fix/prelaunch-hardening]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: dota_ai_decision_lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dota_ai_decision_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/dota_ai_decision_lab
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/prelaunch-hardening
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply second-wave patch
        run: |
          python tools/_apply_prelaunch_second_wave.py
          python - <<'PY'
          from pathlib import Path

          for filename in (
              "migrations/versions/0015_ti_provider_identity_repair.py",
              "migrations/versions/0017_ti_team_alias_identity_merge.py",
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  'f"UPDATE {table} SET {column} = :target WHERE {column} = :source"\n',
                  'f"UPDATE {table} SET {column} = :target WHERE {column} = :source"  # noqa: S608 - closed migration identifiers\n',
                  1,
              )
              path.write_text(text, encoding="utf-8")

          path = Path("tools/wechat_clawbot.py")
          text = path.read_text(encoding="utf-8")
          if "import shutil\n" not in text:
              text = text.replace("import subprocess\n", "import shutil\nimport subprocess\n", 1)
          text = text.replace(
              '    try:\n        completed = subprocess.run(  # noqa: S603, S607 - fixed local CLI, no shell\n            ["npx", "-y", "qrcode-terminal", qrcode_url],\n',
              '    try:\n        npx = shutil.which("npx")\n        if npx is None:\n            return False\n        completed = subprocess.run(  # noqa: S603 - resolved executable, no shell\n            [npx, "-y", "qrcode-terminal", qrcode_url],\n',
              1,
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_main_import.py")
          text = path.read_text(encoding="utf-8").replace(
              'pytest.raises(ValidationError, match="AI_TIMEOUT_SECNODS")',
              'pytest.raises(ValidationError, match="ai_timeout_secnods")',
              1,
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_web_api_contract.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from starlette.testclient import TestClient\n",
              "from fastapi import WebSocketDisconnect\n",
              1,
          )
          old = '''def test_status_websocket_serializes_runtime_timestamps(tmp_path: Path) -> None:\n    engine = create_async_engine("sqlite+aiosqlite:///:memory:")\n    factory = async_sessionmaker(engine, expire_on_commit=False)\n    health = HealthRegistry()\n    app = create_app(factory, health, frontend_dist=tmp_path / "missing")\n\n    with TestClient(app) as client:\n        with client.websocket_connect("/ws/status") as websocket:\n            payload = websocket.receive_json()\n\n    assert isinstance(payload["observed_at"], str)\n'''
          new = '''@pytest.mark.asyncio\nasync def test_status_websocket_serializes_runtime_timestamps(tmp_path: Path) -> None:\n    engine = create_async_engine("sqlite+aiosqlite:///:memory:")\n    async with engine.begin() as connection:\n        await connection.run_sync(Base.metadata.create_all)\n    factory = async_sessionmaker(engine, expire_on_commit=False)\n    health = HealthRegistry()\n    app = create_app(factory, health, frontend_dist=tmp_path / "missing")\n    route = next(\n        item for item in app.routes if getattr(item, "path", None) == "/ws/status"\n    )\n\n    class CaptureSocket:\n        payload = None\n\n        async def accept(self) -> None:\n            return None\n\n        async def send_json(self, payload) -> None:\n            self.payload = payload\n            raise WebSocketDisconnect()\n\n    websocket = CaptureSocket()\n    await route.endpoint(websocket)\n    assert websocket.payload is not None\n    assert isinstance(websocket.payload["observed_at"], str)\n    await engine.dispose()\n'''
          if old not in text:
              raise RuntimeError("legacy TestClient websocket test not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install backend
        run: uv sync --frozen --extra dev
      - name: Format and lint product code
        run: |
          uv run ruff format app migrations tests tools --exclude tools/_apply_prelaunch_second_wave.py
          uv run ruff check --fix app migrations tests tools --exclude tools/_apply_prelaunch_second_wave.py
          uv run ruff check app migrations tests tools --exclude tools/_apply_prelaunch_second_wave.py
          uv run ruff check --select S app migrations tools --exclude tools/_apply_prelaunch_second_wave.py
      - name: Migrate and verify schema
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Backend full suite
        run: uv run pytest -W error
      - name: Frontend install and audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm test
          npm run build
      - name: Remove temporary patch plumbing and commit
        run: |
          rm tools/_apply_prelaunch_second_wave.py
          rm .github/workflows/run-prelaunch-second-wave.yml
          rm .github/workflows/run-prelaunch-audit.yml
          uv run ruff format app migrations tests tools
          uv run ruff check --fix app migrations tests tools
          uv run ruff check app migrations tests tools
          uv run ruff check --select S app migrations tools
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close prelaunch audit findings"
          git push origin HEAD:fix/prelaunch-hardening
