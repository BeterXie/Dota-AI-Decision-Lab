name: Temporary access-grants safe lint fixer

on:
  push:
    branches:
      - feat/access-grants-promotions

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/access-grants-promotions
          fetch-depth: 1
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.0
          python-version: '3.14'
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --frozen --extra dev
      - name: Capture residual Ruff diagnostics
        shell: bash
        run: |
          set +e
          uv run ruff check app migrations tests tools > ruff-residual-access-grants.txt 2>&1
          code=$?
          cat ruff-residual-access-grants.txt
          echo "$code" > ruff-residual-access-grants.exit
          exit 0
      - name: Commit temporary diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ruff-residual-access-grants.txt ruff-residual-access-grants.exit
          git commit -m "Capture residual Ruff diagnostics"
          git push origin HEAD:feat/access-grants-promotions
