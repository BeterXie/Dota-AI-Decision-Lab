name: Temporary access-grants residual lint fixer

on:
  push:
    branches:
      - feat/access-grants-promotions

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/access-grants-promotions
          fetch-depth: 1
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.0
          python-version: '3.14'
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --frozen --extra dev
      - name: Apply final residual lint fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/notifications/secure_center.py")
          text = path.read_text(encoding="utf-8")
          old = '                delivery.last_error = "binding, preference, account, or scoped realtime entitlement is no longer active"\n'
          new = '                delivery.last_error = (\n                    "binding, preference, account, or scoped realtime "\n                    "entitlement is no longer active"\n                )\n'
          if old not in text:
              raise SystemExit("secure_center residual line not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("app/promotions/paddle_series.py")
          text = path.read_text(encoding="utf-8")
          old = '                    "a recent checkout for this series is still pending; complete or abandon it first"\n'
          new = '                    "a recent checkout for this series is still pending; "\n                    "complete or abandon it first"\n'
          if old not in text:
              raise SystemExit("paddle_series residual line not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm -f ruff-residual-access-grants.txt ruff-residual-access-grants.exit
          uv run ruff format app migrations tests tools
          uv run ruff check app migrations tests tools
      - name: Commit final lint fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/notifications/secure_center.py app/promotions/paddle_series.py
          git add -u ruff-residual-access-grants.txt ruff-residual-access-grants.exit || true
          git commit -m "Fix residual access grants lint"
          git push origin HEAD:feat/access-grants-promotions
