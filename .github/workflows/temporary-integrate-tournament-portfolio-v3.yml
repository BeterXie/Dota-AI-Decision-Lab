name: Temporary integrate tournament portfolio v3

on:
  push:
    branches:
      - feat/ai-tournament-portfolio-quality-gate

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dota_ai_decision_lab
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dota_ai_decision_lab
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/ai-tournament-portfolio-quality-gate
          fetch-depth: 1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.0
          python-version: '3.14'
      - run: uv sync --frozen --extra dev
      - name: Apply runtime integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"target not found in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          # Historical accounts must be funded at the event boundary, not at replay time.
          replace(
              "app/evaluation/portfolio.py",
              "    CanonicalMap,\n    CanonicalSeries,\n",
              "    CanonicalEvent,\n    CanonicalMap,\n    CanonicalSeries,\n",
          )
          replace(
              "app/evaluation/portfolio.py",
              '''        candidate = TournamentPortfolioAccountRecord(\n''',
              '''        event = await session.get(CanonicalEvent, canonical_event_id)\n        funded_at = (\n            event.started_at\n            if event is not None and event.started_at is not None\n            else datetime.now(UTC)\n        )\n        candidate = TournamentPortfolioAccountRecord(\n''',
          )
          replace(
              "app/evaluation/portfolio.py",
              '''            occurred_at=candidate.created_at,\n''',
              '''            occurred_at=funded_at,\n''',
          )

          replace(
              "app/ai/base.py",
              'DECISION_POLICY_VERSION = "shadow-decision-v2"',
              'DECISION_POLICY_VERSION = "shadow-tournament-portfolio-v3"',
          )
          replace(
              "app/ai/base.py",
              '''- BUY_A/BUY_B require 0 < stake <= virtual_bankroll.bankroll_before.\n  NO_BUY/INSUFFICIENT_DATA use stake null/0. Stake is virtual audit capital only.\n''',
              '''- virtual_bankroll is one shared canonical-event shadow portfolio for this\n  provider/model experiment. bankroll_before is available cash after prior settled P&L\n  and currently locked positions; locked_balance cannot be staked again.\n- BUY_A/BUY_B require 0 < stake <= virtual_bankroll.bankroll_before.\n  NO_BUY/INSUFFICIENT_DATA use stake null/0. Stake is virtual audit capital only.\n''',
          )

          replace(
              "app/ai/coordinator.py",
              "from app.domain.snapshot import DecisionSnapshot\nfrom app.models import AiDecisionRecord, DecisionSnapshotRecord\n",
              "from app.domain.snapshot import DecisionSnapshot\nfrom app.evaluation.portfolio import PortfolioContext, TournamentPortfolioService\nfrom app.models import AiDecisionRecord, DecisionSnapshotRecord\n",
          )
          replace(
              "app/ai/coordinator.py",
              '''class _PriorDecision:\n    decision_at: datetime\n    mode: str\n    decision: AiDecision\n''',
              '''class _PriorDecision:\n    decision_at: datetime\n    mode: str\n    decision: AiDecision\n    bankroll_before: float | None = None\n''',
          )
          replace(
              "app/ai/coordinator.py",
              '''        virtual_bankroll: float = 10_000.0,\n        prior_decisions_limit: int = 10,\n    ) -> None:\n''',
              '''        virtual_bankroll: float = 10_000.0,\n        prior_decisions_limit: int = 10,\n        portfolio: TournamentPortfolioService | None = None,\n    ) -> None:\n''',
          )
          replace(
              "app/ai/coordinator.py",
              '''        self._virtual_bankroll = round(float(virtual_bankroll), 2)\n        self._prior_decisions_limit = prior_decisions_limit\n''',
              '''        self._virtual_bankroll = round(float(virtual_bankroll), 2)\n        self._prior_decisions_limit = prior_decisions_limit\n        self._portfolio = portfolio\n''',
          )
          replace(
              "app/ai/coordinator.py",
              '''        prior = await self._prior_decisions(\n            session,\n            canonical_map_id=canonical_map_id,\n            snapshot=snapshot,\n            provider=provider,\n            model=model,\n        )\n        bankroll_context = self._bankroll_context(prior)\n''',
              '''        prior = await self._prior_decisions(\n            session,\n            canonical_map_id=canonical_map_id,\n            snapshot=snapshot,\n            provider=provider,\n            model=model,\n        )\n        portfolio_context = (\n            await self._portfolio.context_for_snapshot(\n                session,\n                snapshot_id=snapshot.snapshot_id,\n                experiment=experiment,\n            )\n            if self._portfolio is not None\n            else None\n        )\n        bankroll_context = self._bankroll_context(\n            prior, portfolio_context=portfolio_context\n        )\n''',
          )
          replace(
              "app/ai/coordinator.py",
              '''            prior = prior_by_provider_model.get((provider.name, provider.model), [])\n            bankroll_context = self._bankroll_context(prior)\n''',
              '''            prior = prior_by_provider_model.get((provider.name, provider.model), [])\n            portfolio_context = (\n                await self._portfolio.context_for_snapshot(\n                    session,\n                    snapshot_id=snapshot.snapshot_id,\n                    experiment=experiment,\n                )\n                if self._portfolio is not None\n                else None\n            )\n            bankroll_context = self._bankroll_context(\n                prior, portfolio_context=portfolio_context\n            )\n''',
          )
          replace(
              "app/ai/coordinator.py",
              '''        await session.flush()\n        return records\n''',
              '''        await session.flush()\n        if self._portfolio is not None:\n            for prepared, record in zip(prepared_jobs, records, strict=True):\n                if prepared.existing_record is None:\n                    await self._portfolio.record_decision_position(session, record)\n        return records\n''',
          )
          old_bankroll = '''    def _bankroll_context(self, prior: list[_PriorDecision]) -> dict:\n        bankroll_before = self._virtual_bankroll\n        prior_decisions: list[dict] = []\n        for item in prior:\n            stake = round(float(item.decision.stake or 0.0), 2)\n            prior_decisions.append(\n                {\n                    "decision_at": item.decision_at.isoformat(),\n                    "mode": item.mode,\n                    "action": item.decision.action,\n                    "fair_probability_a": item.decision.fair_probability_a,\n                    "confidence": item.decision.confidence,\n                    "market_assessment": item.decision.market_assessment,\n                    "minimum_acceptable_odds_a": item.decision.minimum_acceptable_odds_a,\n                    "stake": stake,\n                    "bankroll_before": bankroll_before,\n                    "bankroll_after": round(bankroll_before - stake, 2),\n                    "primary_reasons": item.decision.primary_reasons,\n                    "blockers": item.decision.blockers,\n                }\n            )\n            bankroll_before = round(bankroll_before - stake, 2)\n        return {\n            "initial": self._virtual_bankroll,\n            "bankroll_before": bankroll_before,\n            "unsettled_stakes": round(self._virtual_bankroll - bankroll_before, 2),\n            "units": "virtual-units",\n            # Accounting covers every canonical prior round. Only the most\n            # recent rounds are shown to the model, keeping token usage and\n            # bankroll correctness as two independent controls.\n            "prior_decisions": prior_decisions[-self._prior_decisions_limit :],\n        }\n'''
          new_bankroll = '''    def _bankroll_context(\n        self,\n        prior: list[_PriorDecision],\n        *,\n        portfolio_context: PortfolioContext | None = None,\n    ) -> dict:\n        if portfolio_context is None:\n            bankroll_before = self._virtual_bankroll\n            prior_decisions: list[dict] = []\n            for item in prior:\n                stake = round(float(item.decision.stake or 0.0), 2)\n                prior_decisions.append(\n                    self._prior_payload(\n                        item, bankroll_before=bankroll_before, stake=stake\n                    )\n                )\n                bankroll_before = round(bankroll_before - stake, 2)\n            return {\n                "initial": self._virtual_bankroll,\n                "bankroll_before": bankroll_before,\n                "unsettled_stakes": round(self._virtual_bankroll - bankroll_before, 2),\n                "units": "virtual-units",\n                "prior_decisions": prior_decisions[-self._prior_decisions_limit :],\n            }\n\n        prior_decisions = []\n        for item in prior:\n            stake = round(float(item.decision.stake or 0.0), 2)\n            frozen_before = (\n                item.bankroll_before\n                if item.bankroll_before is not None\n                else float(portfolio_context.cash_balance)\n            )\n            prior_decisions.append(\n                self._prior_payload(\n                    item, bankroll_before=frozen_before, stake=stake\n                )\n            )\n        return {\n            **portfolio_context.provider_payload(),\n            "unsettled_stakes": float(portfolio_context.locked_balance),\n            "prior_decisions": prior_decisions[-self._prior_decisions_limit :],\n        }\n\n    @staticmethod\n    def _prior_payload(\n        item: _PriorDecision, *, bankroll_before: float, stake: float\n    ) -> dict:\n        bankroll_after = round(bankroll_before - stake, 2)\n        return {\n            "decision_at": item.decision_at.isoformat(),\n            "mode": item.mode,\n            "action": item.decision.action,\n            "fair_probability_a": item.decision.fair_probability_a,\n            "confidence": item.decision.confidence,\n            "market_assessment": item.decision.market_assessment,\n            "minimum_acceptable_odds_a": item.decision.minimum_acceptable_odds_a,\n            "stake": stake,\n            "bankroll_before": bankroll_before,\n            "bankroll_after": bankroll_after,\n            "bankroll_after_commit": bankroll_after,\n            "primary_reasons": item.decision.primary_reasons,\n            "blockers": item.decision.blockers,\n        }\n'''
          replace("app/ai/coordinator.py", old_bankroll, new_bankroll)
          replace(
              "app/ai/coordinator.py",
              '''            _PriorDecision(\n                decision_at=decision_at,\n                mode=mode,\n                decision=decision,\n            )\n''',
              '''            _PriorDecision(\n                decision_at=decision_at,\n                mode=mode,\n                decision=decision,\n                bankroll_before=(\n                    float(record.bankroll_before)\n                    if record.bankroll_before is not None\n                    else None\n                ),\n            )\n''',
          )

          replace(
              "app/ai/lanes.py",
              '''def ai_experiment_lane_key(\n    snapshot: DecisionSnapshot,\n    *,\n    provider: str,\n    model: str,\n) -> str:\n''',
              '''def ai_experiment_lane_key(\n    snapshot: DecisionSnapshot,\n    *,\n    provider: str,\n    model: str,\n    account_scope: str | None = None,\n) -> str:\n''',
          )
          replace(
              "app/ai/lanes.py",
              '''    match_scope = (\n        identity.get("map_id")\n''',
              '''    match_scope = account_scope or (\n        identity.get("map_id")\n''',
          )

          replace(
              "app/jobs/handlers.py",
              "from app.evaluation.metrics import EvaluationService\nfrom app.evaluation.settlement import SettlementService\n",
              "from app.evaluation.metrics import EvaluationService\nfrom app.evaluation.portfolio import TournamentPortfolioService\nfrom app.evaluation.settlement import SettlementService\n",
          )
          replace(
              "app/jobs/handlers.py",
              '''    evaluation: EvaluationService\n    dltv_result: object | None = None\n''',
              '''    evaluation: EvaluationService\n    portfolio: TournamentPortfolioService\n    dltv_result: object | None = None\n''',
          )
          replace(
              "app/jobs/handlers.py",
              '''        lane_key = ai_experiment_lane_key(snapshot, provider=provider, model=model)\n''',
              '''        portfolio = getattr(self._d, "portfolio", None)\n        account_scope = None\n        if portfolio is not None:\n            async with self._d.session_factory() as session:\n                account_scope = await portfolio.lane_scope_for_snapshot(\n                    session, snapshot.snapshot_id\n                )\n        lane_key = ai_experiment_lane_key(\n            snapshot,\n            provider=provider,\n            model=model,\n            account_scope=account_scope,\n        )\n''',
          )
          replace(
              "app/jobs/handlers.py",
              '''            await session.flush()\n\n            snapshot_records = list(\n''',
              '''            await session.flush()\n            portfolio = getattr(self._d, "portfolio", None)\n            if portfolio is not None:\n                for prepared, record in results:\n                    if prepared.existing_record is None:\n                        await portfolio.record_decision_position(session, record)\n\n            snapshot_records = list(\n''',
          )
          replace(
              "app/jobs/handlers.py",
              '''            snapshots = list(\n''',
              '''            portfolio = getattr(self._d, "portfolio", None)\n            if portfolio is not None:\n                await portfolio.settle_map(\n                    session,\n                    canonical_map_id=canonical_map_id,\n                    winner_team_id=result.winner_team_id,\n                    provider_conflict=bool(result.provider_conflict),\n                    settled_at=result.settled_at,\n                )\n            snapshots = list(\n''',
          )

          replace(
              "app/main.py",
              "from app.evaluation import EvaluationService, FutureOddsService, SettlementService\n",
              "from app.evaluation import (\n    EvaluationService,\n    FutureOddsService,\n    SettlementService,\n    TournamentPortfolioService,\n)\n",
          )
          replace(
              "app/main.py",
              '''    ai_providers = _ai_providers(settings)\n    ai = AiCoordinator(\n''',
              '''    ai_providers = _ai_providers(settings)\n    portfolio = TournamentPortfolioService(initial_bankroll=settings.ai_virtual_bankroll)\n    ai = AiCoordinator(\n''',
          )
          replace(
              "app/main.py",
              '''        virtual_bankroll=settings.ai_virtual_bankroll,\n        prior_decisions_limit=settings.ai_prior_decisions_limit,\n    )\n''',
              '''        virtual_bankroll=settings.ai_virtual_bankroll,\n        prior_decisions_limit=settings.ai_prior_decisions_limit,\n        portfolio=portfolio,\n    )\n''',
          )
          replace(
              "app/main.py",
              '''            settlement=SettlementService(),\n            evaluation=EvaluationService(),\n            dltv_result=dltv_result,\n''',
              '''            settlement=SettlementService(),\n            evaluation=EvaluationService(),\n            portfolio=portfolio,\n            dltv_result=dltv_result,\n''',
          )
          replace(
              "app/config.py",
              '''    # Each provider/model owns an independent virtual shadow bankroll per match.\n    # Models choose a virtual stake within the available bankroll; no real money\n    # and no automatic execution exist in V1.\n''',
              '''    # Each provider/model experiment owns one independent virtual shadow bankroll\n    # per canonical event. Settled map P&L carries into later maps and concurrent\n    # open positions share the same available cash. No real-money execution exists.\n''',
          )
          replace(
              "tests/test_production_lifecycle_replay.py",
              'assert revision == "0034_access_grants_promotions"',
              'assert revision == "0035_ai_tournament_portfolio"',
          )
          PY
          uv run ruff check --fix app/ai app/config.py app/evaluation app/jobs/handlers.py app/main.py migrations tests/test_tournament_portfolio.py tests/test_production_lifecycle_replay.py
          uv run ruff format app/ai app/config.py app/evaluation app/jobs/handlers.py app/main.py migrations tests/test_tournament_portfolio.py tests/test_production_lifecycle_replay.py
          uv run ruff check app/ai app/config.py app/evaluation app/jobs/handlers.py app/main.py migrations tests/test_tournament_portfolio.py tests/test_production_lifecycle_replay.py
      - name: Validate migration and targeted behavior
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run pytest -W error -q \
            tests/test_tournament_portfolio.py \
            tests/test_ai_coordinator.py \
            tests/test_ai_scheduling.py \
            tests/test_production_lifecycle_replay.py
      - name: Commit verified integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app migrations tests
          git commit -m "Integrate event-level AI tournament bankroll"
          git push origin HEAD:feat/ai-tournament-portfolio-quality-gate
