name: Format AI fix branch

on:
  push:
    branches:
      - fix/ai-decision-sequencing-and-notifications

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ai-decision-sequencing-and-notifications
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          python-version: "3.14"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format app migrations tests tools
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to format"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app migrations tests tools
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:fix/ai-decision-sequencing-and-notifications
