name: Temporary fix AI performance E2E selectors

on:
  push:
    branches:
      - feat/ai-performance-dashboard

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/ai-performance-dashboard
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fix selectors and CLV display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/e2e/performance.spec.ts")
          text = path.read_text(encoding="utf-8")
          old = '''  await expect(page.getByText("+2,600", { exact: true })).toBeVisible();\n  await expect(page.getByText("−400", { exact: true })).toBeVisible();\n'''
          new = '''  const gptRow = page.getByRole("button", { name: /#1 GPT gpt-5\\.6/ });\n  const deepseekRow = page.getByRole("button", { name: /#2 DeepSeek deepseek-reasoner/ });\n  await expect(gptRow).toContainText("+2,600");\n  await expect(deepseekRow).toContainText("−400");\n'''
          if old not in text:
              raise SystemExit("performance E2E selector block not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              '  await page.getByRole("button", { name: /DeepSeek/ }).click();\n',
              '  await deepseekRow.click();\n',
              1,
          )
          text = text.replace(
              '  await expect(page.getByText(/decision-…7890/)).toBeVisible();\n',
              '  await expect(page.getByText(/decision…7890/)).toBeVisible();\n',
              1,
          )
          path.write_text(text, encoding="utf-8")

          path = Path("frontend/src/components/AiPerformancePage.tsx")
          text = path.read_text(encoding="utf-8")
          old = '<MetricLine label="CLV" value={percentPoints(quality.average_clv)} tone={tone(quality.average_clv)} />'
          new = '<MetricLine label="CLV" value={rate(quality.average_clv, locale)} tone={tone(quality.average_clv)} />'
          if old not in text:
              raise SystemExit("CLV metric line not found")
          text = text.replace(old, new, 1)
          old_helper = '''function percentPoints(value: number | null): string {\n  return value == null ? "—" : `${value > 0 ? "+" : ""}${(value * 100).toFixed(2)}pp`;\n}\n\n'''
          if old_helper not in text:
              raise SystemExit("percentPoints helper not found")
          text = text.replace(old_helper, "", 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify focused performance UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test e2e/performance.spec.ts
      - name: Commit verified UI fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/performance.spec.ts frontend/src/components/AiPerformancePage.tsx
          git commit -m "Harden AI performance dashboard semantics"
          git push origin HEAD:feat/ai-performance-dashboard
