name: Temporary verify team-aware AI performance audit

on:
  push:
    branches:
      - feat/ai-performance-dashboard

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/ai-performance-dashboard
          fetch-depth: 1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.0
          python-version: '3.14'
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Add team identity to audit UI contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/performanceApi.ts")
          text = path.read_text(encoding="utf-8")
          old = '''  action: string;\n  cash_before: number;\n'''
          new = '''  action: string;\n  team_a: { id: string; name: string };\n  team_b: { id: string; name: string };\n  selected_team: { id: string; name: string } | null;\n  cash_before: number;\n'''
          if old not in text:
              raise SystemExit("position audit type anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("frontend/src/components/AiPerformancePage.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''        <span><b>{position.action.replace("_", " ")}</b><small>{locale === "zh-CN" ? "AI 操作" : "AI action"}</small></span>\n'''
          new = '''        <span><b>{position.selected_team?.name ?? position.action.replace("_", " ")}</b><small>{position.action.replace("_", " ")} · {locale === "zh-CN" ? "AI 操作" : "AI action"}</small></span>\n'''
          if old not in text:
              raise SystemExit("position action row not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("frontend/src/components/ai-performance.css")
          text = path.read_text(encoding="utf-8")
          old = '''  .performance-position-main { grid-template-columns: 1fr 88px; }\n  .performance-position-main > :nth-child(2),\n  .performance-position-main > :nth-child(4) { display: none; }\n'''
          new = '''  .performance-position-main { grid-template-columns: 48px minmax(0, 1fr) 82px; }\n  .performance-position-main > :nth-child(3),\n  .performance-position-main > :nth-child(4),\n  .performance-position-main > :nth-child(6) { display: none; }\n'''
          if old not in text:
              raise SystemExit("mobile position layout block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("frontend/e2e/performance.spec.ts")
          text = path.read_text(encoding="utf-8")
          old = '''      action: "BUY_A",\n      cash_before: 10700,\n'''
          new = '''      action: "BUY_A",\n      team_a: { id: "team-spirit", name: "Team Spirit" },\n      team_b: { id: "team-aurora", name: "Aurora" },\n      selected_team: { id: "team-spirit", name: "Team Spirit" },\n      cash_before: 10700,\n'''
          if old not in text:
              raise SystemExit("won position fixture anchor not found")
          text = text.replace(old, new, 1)
          old = '''      action: "BUY_B",\n      cash_before: 11470,\n'''
          new = '''      action: "BUY_B",\n      team_a: { id: "team-spirit", name: "Team Spirit" },\n      team_b: { id: "team-aurora", name: "Aurora" },\n      selected_team: { id: "team-aurora", name: "Aurora" },\n      cash_before: 11470,\n'''
          if old not in text:
              raise SystemExit("rejected position fixture anchor not found")
          text = text.replace(old, new, 1)
          old = '''  await page.getByText("MAP 2", { exact: true }).click();\n  await expect(page.getByText("10,700", { exact: true })).toBeVisible();\n'''
          new = '''  await expect(page.getByText("Team Spirit", { exact: true })).toBeVisible();\n  await page.getByText("MAP 2", { exact: true }).click();\n  await expect(page.getByText("10,700", { exact: true })).toBeVisible();\n'''
          if old not in text:
              raise SystemExit("position expansion test anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("tests/test_quality_position_audit.py")
          text = path.read_text(encoding="utf-8")
          old = '''        assert payload["positions"][0]["status"] == "REJECTED"\n        assert payload["positions"][0]["rejection_reason"] == "MARKET_NOT_EXECUTABLE"\n'''
          new = '''        assert payload["positions"][0]["status"] == "REJECTED"\n        assert payload["positions"][0]["selected_team"] == {\n            "id": str(team_b.id),\n            "name": "Team B",\n        }\n        assert payload["positions"][0]["rejection_reason"] == "MARKET_NOT_EXECUTABLE"\n'''
          if old not in text:
              raise SystemExit("rejected audit assertion anchor not found")
          text = text.replace(old, new, 1)
          old = '''        assert payload["positions"][1]["status"] == "WON"\n        assert payload["positions"][1]["odds"] == 2.0\n'''
          new = '''        assert payload["positions"][1]["status"] == "WON"\n        assert payload["positions"][1]["selected_team"] == {\n            "id": str(team_a.id),\n            "name": "Team A",\n        }\n        assert payload["positions"][1]["odds"] == 2.0\n'''
          if old not in text:
              raise SystemExit("won audit assertion anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Verify backend audit projection
        run: |
          uv sync --frozen --extra dev
          uv run ruff format app/web/quality.py tests/test_quality_position_audit.py
          uv run ruff check app/web/quality.py tests/test_quality_position_audit.py
          uv run pytest -q tests/test_quality_position_audit.py
      - name: Verify frontend audit interaction
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test e2e/performance.spec.ts e2e/performance-access.spec.ts
      - name: Commit verified team-aware audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/quality.py tests/test_quality_position_audit.py frontend/src/performanceApi.ts frontend/src/components/AiPerformancePage.tsx frontend/src/components/ai-performance.css frontend/e2e/performance.spec.ts
          git commit -m "Show selected teams in AI position audit"
          git push origin HEAD:feat/ai-performance-dashboard
