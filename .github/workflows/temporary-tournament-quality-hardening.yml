name: Temporary tournament quality hardening

on:
  push:
    branches:
      - feat/ai-tournament-portfolio-quality-gate

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dota_ai_decision_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dota_ai_decision_lab
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/ai-tournament-portfolio-quality-gate
          fetch-depth: 1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.0
          python-version: '3.14'
      - run: uv sync --frozen --extra dev
      - name: Apply late-result hardening
        run: uv run python tools/temporary_patch_tournament_quality.py
      - name: Ruff targeted scope
        run: |
          uv run ruff check --fix app/evaluation app/web/quality.py app/web/__init__.py tests/test_tournament_portfolio_late_result.py tests/test_tournament_portfolio_postgres.py tests/test_tournament_quality.py
          uv run ruff format app/evaluation app/web/quality.py app/web/__init__.py tests/test_tournament_portfolio_late_result.py tests/test_tournament_portfolio_postgres.py tests/test_tournament_quality.py
          uv run ruff check app/evaluation app/web/quality.py app/web/__init__.py tests/test_tournament_portfolio_late_result.py tests/test_tournament_portfolio_postgres.py tests/test_tournament_quality.py
      - name: Validate portfolio hardening and quality report
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run pytest -W error -q \
            tests/test_tournament_portfolio.py \
            tests/test_tournament_portfolio_late_result.py \
            tests/test_tournament_portfolio_postgres.py \
            tests/test_tournament_quality.py \
            tests/test_ai_coordinator.py \
            tests/test_ai_scheduling.py
      - name: Commit verified hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests migrations
          git commit -m "Harden tournament portfolio settlement and quality report"
          git push origin HEAD:feat/ai-tournament-portfolio-quality-gate
