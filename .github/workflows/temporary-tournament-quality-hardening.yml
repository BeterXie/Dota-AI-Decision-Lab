name: Temporary tournament quality hardening

on:
  push:
    branches:
      - feat/ai-tournament-portfolio-quality-gate

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dota_ai_decision_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dota_ai_decision_lab
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/ai-tournament-portfolio-quality-gate
          fetch-depth: 1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.0
          python-version: '3.14'
      - run: uv sync --frozen --extra dev
      - name: Apply late-result and quality API hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"target not found in {path}: {old[:180]!r}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          replace(
              "app/evaluation/portfolio.py",
              "    DecisionSnapshotRecord,\n)\n",
              "    DecisionSnapshotRecord,\n    MapResultRecord,\n)\nfrom app.time import ensure_utc\n",
          )
          replace(
              "app/evaluation/portfolio.py",
              """        rejection_reason = None
        status = "OPEN"
        if odds is None:
            status = "REJECTED"
            rejection_reason = "MISSING_DECISION_ODDS"
        elif stake > _money(account.cash_balance):
            status = "REJECTED"
            rejection_reason = "INSUFFICIENT_CASH"
""",
              """        result = await session.scalar(
            select(MapResultRecord).where(
                MapResultRecord.canonical_map_id == scope.canonical_map_id
            )
        )
        decision_available_at = ensure_utc(
            record.response_received_at
            or record.decision_persisted_at
            or record.request_started_at
        )
        rejection_reason = None
        status = "OPEN"
        if result is not None and ensure_utc(result.settled_at) <= decision_available_at:
            status = "REJECTED"
            rejection_reason = "MAP_ALREADY_SETTLED"
        elif odds is None:
            status = "REJECTED"
            rejection_reason = "MISSING_DECISION_ODDS"
        elif stake > _money(account.cash_balance):
            status = "REJECTED"
            rejection_reason = "INSUFFICIENT_CASH"
""",
          )
          replace(
              "app/evaluation/portfolio.py",
              """        await self._ledger(
            session,
            account=account,
            position=position,
            entry_type="BET_PLACED",
            cash_delta=-stake,
            locked_delta=stake,
            realized_pnl_delta=_ZERO,
            dedupe_key=f"place:{record.id}",
            occurred_at=record.request_started_at,
        )
        return position
""",
              """        await self._ledger(
            session,
            account=account,
            position=position,
            entry_type="BET_PLACED",
            cash_delta=-stake,
            locked_delta=stake,
            realized_pnl_delta=_ZERO,
            dedupe_key=f"place:{record.id}",
            occurred_at=record.request_started_at,
        )
        if result is not None:
            await self.settle_map(
                session,
                canonical_map_id=scope.canonical_map_id,
                winner_team_id=result.winner_team_id,
                provider_conflict=bool(result.provider_conflict),
                settled_at=result.settled_at,
            )
        return position
""",
          )
          replace(
              "app/web/review.py",
              "from fastapi import APIRouter, Query\n",
              "from fastapi import APIRouter, HTTPException, Query\n",
          )
          replace(
              "app/web/review.py",
              "from app.ai.eligibility import ai_record_is_game_time_eligible\n",
              "from app.ai.eligibility import ai_record_is_game_time_eligible\nfrom app.evaluation.quality import TournamentQualityService\n",
          )
          replace(
              "app/web/review.py",
              """    cache: dict[int, tuple[float, dict[str, Any]]] = {}
    cache_lock = asyncio.Lock()

""",
              """    cache: dict[int, tuple[float, dict[str, Any]]] = {}
    cache_lock = asyncio.Lock()
    quality_service = TournamentQualityService()

    @router.get("/api/review/events/{canonical_event_id}/ai-quality")
    async def event_ai_quality(canonical_event_id: UUID) -> dict[str, Any]:
        async with session_factory() as session:
            event = await session.get(CanonicalEvent, canonical_event_id)
            if event is None:
                raise HTTPException(status_code=404, detail="canonical event not found")
            return await quality_service.build_report(
                session, canonical_event_id=canonical_event_id
            )

""",
          )
          PY
          uv run ruff check --fix app/evaluation app/web/review.py tests/test_tournament_portfolio_late_result.py tests/test_tournament_portfolio_postgres.py tests/test_tournament_quality.py
          uv run ruff format app/evaluation app/web/review.py tests/test_tournament_portfolio_late_result.py tests/test_tournament_portfolio_postgres.py tests/test_tournament_quality.py
          uv run ruff check app/evaluation app/web/review.py tests/test_tournament_portfolio_late_result.py tests/test_tournament_portfolio_postgres.py tests/test_tournament_quality.py
      - name: Validate portfolio hardening and quality report
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run pytest -W error -q \
            tests/test_tournament_portfolio.py \
            tests/test_tournament_portfolio_late_result.py \
            tests/test_tournament_portfolio_postgres.py \
            tests/test_tournament_quality.py \
            tests/test_ai_coordinator.py \
            tests/test_ai_scheduling.py
      - name: Commit verified hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests migrations
          git commit -m "Harden tournament portfolio settlement and quality report"
          git push origin HEAD:feat/ai-tournament-portfolio-quality-gate
