          ]:
              p = Path("app/web/review.py")
              p.write_text(p.read_text().replace(old_value, new_value))

          replace(
              "app/web/review.py",
              '''    review_points = []\n    for minute in ROSH_REVIEW_MINUTES:\n        point = _curve_point(points, minute)\n        pure = _number(point.get(\"pure_radiant_edge\")) if point is not None else None\n        adjusted = _number(point.get(\"adjusted_radiant_edge\")) if point is not None else None\n        review_points.append(\n            {\n                \"minute\": minute,\n                \"pure\": _rosh_edge_payload(pure, side_identity, winner_team_id),\n                \"adjusted\": _rosh_edge_payload(adjusted, side_identity, winner_team_id),\n            }\n        )\n\n    reference = next(\n        (item for item in review_points if item[\"minute\"] == ROSH_REFERENCE_MINUTE),\n        None,\n    )\n''',
              '''    review_points = []\n    reference = None\n    for minute in ROSH_REVIEW_MINUTES:\n        point = _curve_point(points, minute)\n        pure = _number(point.get(\"pure_radiant_edge\")) if point is not None else None\n        adjusted = _number(point.get(\"adjusted_radiant_edge\")) if point is not None else None\n        review_point = {\n            \"minute\": minute,\n            \"pure\": _rosh_edge_payload(pure, side_identity, winner_team_id),\n            \"adjusted\": _rosh_edge_payload(adjusted, side_identity, winner_team_id),\n        }\n        review_points.append(review_point)\n        if minute == ROSH_REFERENCE_MINUTE and point is not None:\n            reference = review_point\n''',
          )
          replace(
              "app/web/review.py",
              '''def _curve_point(points: list[Any], minute: int) -> dict[str, Any] | None:\n    candidates = [\n        item\n        for item in points\n        if isinstance(item, dict) and _number(item.get(\"minute\")) is not None\n    ]\n    if not candidates:\n        return None\n    exact = next(\n        (item for item in candidates if _number(item.get(\"minute\")) == float(minute)), None\n    )\n    if exact is not None:\n        return exact\n    nearest = min(candidates, key=lambda item: abs((_number(item.get(\"minute\")) or 0.0) - minute))\n    nearest_minute = _number(nearest.get(\"minute\"))\n    if nearest_minute is None or abs(nearest_minute - minute) > 1.0:\n        return None\n    return nearest\n''',
              '''def _curve_point(points: list[Any], minute: int) -> dict[str, Any] | None:\n    return next(\n        (\n            item\n            for item in points\n            if isinstance(item, dict) and _number(item.get(\"minute\")) == float(minute)\n        ),\n        None,\n    )\n''',
          )
          replace(
              "app/web/review.py",
              '''def _odds_review(\n    snapshots: list[DecisionSnapshotRecord],\n    *,\n    closings: list[DecisionFutureOdds],\n) -> dict[str, Any] | None:\n    pairs = [\n        pair for snapshot in snapshots if (pair := _snapshot_market_pair(snapshot)) is not None\n    ]\n''',
              '''def _odds_review(\n    snapshots: list[DecisionSnapshotRecord],\n    *,\n    closings: list[DecisionFutureOdds],\n    ai_min_game_time_seconds: int = 600,\n) -> dict[str, Any] | None:\n    pairs = [\n        pair\n        for snapshot in snapshots\n        if (\n            pair := _snapshot_market_pair(\n                snapshot,\n                min_game_time_seconds=ai_min_game_time_seconds,\n            )\n        )\n        is not None\n    ]\n''',
          )
          replace(
              "app/web/review.py",
              '''        and item.odds_b > 1\n        and item.status == \"CAPTURED\"\n    ]\n''',
              '''        and item.odds_b > 1\n        and item.status == \"CAPTURED\"\n        and (item.observed_at is not None or item.triggered_at is not None)\n    ]\n''',
          )
          replace(
              "app/web/review.py",
              '''def _snapshot_market_pair(snapshot: DecisionSnapshotRecord) -> dict[str, Any] | None:\n    payload = snapshot.canonical_payload\n    identity = payload.get(\"identity\") if isinstance(payload, dict) else None\n    market = payload.get(\"market\") if isinstance(payload, dict) else None\n    if not isinstance(identity, dict) or not isinstance(market, dict):\n        return None\n''',
              '''def _snapshot_market_pair(\n    snapshot: DecisionSnapshotRecord,\n    *,\n    min_game_time_seconds: int = 600,\n) -> dict[str, Any] | None:\n    payload = snapshot.canonical_payload\n    identity = payload.get(\"identity\") if isinstance(payload, dict) else None\n    market = payload.get(\"market\") if isinstance(payload, dict) else None\n    snapshot_quality = payload.get(\"quality\") if isinstance(payload, dict) else None\n    market_quality = market.get(\"quality\") if isinstance(market, dict) else None\n    if (\n        not isinstance(identity, dict)\n        or not isinstance(market, dict)\n        or not isinstance(snapshot_quality, dict)\n        or snapshot_quality.get(\"eligible\") is not True\n        or not isinstance(market_quality, dict)\n        or market_quality.get(\"eligible\") is not True\n        or not ai_record_is_game_time_eligible(\n            payload,\n            decision_at=snapshot.decision_at,\n            min_game_time_seconds=min_game_time_seconds,\n        )\n    ):\n        return None\n''',
          )

          # Thread the configured production threshold into the web layer.
          replace(
              "app/web/api.py",
              "    market_max_pair_skew_seconds: float = 5.0,\n) -> FastAPI:\n",
              "    market_max_pair_skew_seconds: float = 5.0,\n    ai_min_game_time_seconds: int = 600,\n) -> FastAPI:\n",
          )
          replace(
              "app/web/api.py",
              "    app.include_router(create_review_router(session_factory))\n",
              "    app.include_router(\n        create_review_router(\n            session_factory,\n            ai_min_game_time_seconds=ai_min_game_time_seconds,\n        )\n    )\n",
          )
          replace(
              "app/web/__init__.py",
              "    market_max_pair_skew_seconds: float = 5.0,\n) -> FastAPI:\n",
              "    market_max_pair_skew_seconds: float = 5.0,\n    ai_min_game_time_seconds: int = 600,\n) -> FastAPI:\n",
          )
          replace(
              "app/web/__init__.py",
              "        market_max_pair_skew_seconds=market_max_pair_skew_seconds,\n    )\n",
              "        market_max_pair_skew_seconds=market_max_pair_skew_seconds,\n        ai_min_game_time_seconds=ai_min_game_time_seconds,\n    )\n",
          )
          replace(
              "app/main.py",
              "        market_max_pair_skew_seconds=settings.market_max_pair_skew_seconds,\n    )\n",
              "        market_max_pair_skew_seconds=settings.market_max_pair_skew_seconds,\n        ai_min_game_time_seconds=settings.ai_min_game_time_seconds,\n    )\n",
          )

          # Exact /review route only, not /reviewfoo.
          replace(
              "frontend/src/App.tsx",
              '''export function App() {\n  const reviewRoute = typeof window !== \"undefined\" && window.location.pathname.startsWith(\"/review\");\n''',
              '''export function App() {\n  const reviewRoute = typeof window !== \"undefined\" && isReviewRoute(window.location.pathname);\n''',
          )
          replace(
              "frontend/src/App.tsx",
              "\nfunction DashboardApp() {\n",
              '''\nexport function isReviewRoute(pathname: string): boolean {\n  return pathname === \"/review\" || pathname.startsWith(\"/review/\");\n}\n\nfunction DashboardApp() {\n''',
          )
          replace(
              "frontend/src/components/ReviewPage.tsx",
              '''    queryFn: () => fetchReviewMatches(100),\n    refetchInterval: 30_000\n''',
              '''    queryFn: () => fetchReviewMatches(100),\n    staleTime: 30_000,\n    refetchInterval: 60_000\n''',
          )

          # Existing review fixture now carries the same eligibility fields as
          # production snapshots.
          replace(
              "tests/test_review_api.py",
              '''                \"market\": {\n                    \"market_type\": \"Winner\",\n''',
              '''                \"market\": {\n                    \"quality\": {\"eligible\": True, \"blockers\": [], \"warnings\": []},\n                    \"market_type\": \"Winner\",\n''',
          )
          replace(
              "tests/test_review_api.py",
              '''                \"draft\": {\n''',
              '''                \"quality\": {\"eligible\": True, \"blockers\": [], \"warnings\": []},\n                \"live\": {\"game_time_seconds\": 1800},\n                \"draft\": {\n''',
          )
          replace(
              "tests/test_review_api.py",
              "from decimal import Decimal\nfrom uuid import uuid4\n",
              "from decimal import Decimal\nfrom types import SimpleNamespace\nfrom uuid import UUID, uuid4\n",
          )
          replace(
              "tests/test_review_api.py",
              "from app.web.api import create_app\n",
              "from app.web.api import create_app\nfrom app.web.review import _odds_review, _rosh_review, _snapshot_market_pair\n",
          )
          p = Path("tests/test_review_api.py")
          text = p.read_text()
          marker = "\n\n@pytest.mark.asyncio\nasync def test_review_api_empty_contract() -> None:\n"
          if marker not in text:
              raise SystemExit("review test insertion anchor missing")
          extra = r'''


def _review_snapshot_record(
    *,
    decision_at: datetime,
    team_a_id: UUID,
    team_b_id: UUID,
    game_time_seconds: int = 700,
    snapshot_eligible: bool = True,
    market_eligible: bool = True,
    curve_points: list[dict] | None = None,
) -> DecisionSnapshotRecord:
    return DecisionSnapshotRecord(
        id=uuid4(),
        canonical_map_id=uuid4(),
        decision_at=decision_at,
        created_at=decision_at,
        mode="LIVE_BASIC",
        snapshot_hash=f"review-{uuid4()}",
        canonical_payload={
            "decision_at": decision_at.isoformat(),
            "identity": {
                "team_a": {"id": str(team_a_id), "name": "A"},
                "team_b": {"id": str(team_b_id), "name": "B"},
                "side_identity": {
                    "status": "RESOLVED",
                    "radiant_team_id": str(team_a_id),
                    "dire_team_id": str(team_b_id),
                },
            },
            "quality": {"eligible": snapshot_eligible, "blockers": [], "warnings": []},
            "live": {"game_time_seconds": game_time_seconds},
            "market": {
                "quality": {"eligible": market_eligible, "blockers": [], "warnings": []},
                "observations": [
                    {"selection_team_id": str(team_a_id), "price": "2.20"},
                    {"selection_team_id": str(team_b_id), "price": "1.70"},
                ],
            },
            "draft": {
                "curve": {
                    "model_version": "rosh-test",
                    "data_version": "data-test",
                    "points": curve_points or [],
                }
            },
        },
    )


def test_review_odds_start_requires_snapshot_market_and_ai_time_eligibility() -> None:
    now = datetime(2026, 8, 15, 12, 0, tzinfo=UTC)
    team_a_id, team_b_id = uuid4(), uuid4()
    assert _snapshot_market_pair(
        _review_snapshot_record(
            decision_at=now,
            team_a_id=team_a_id,
            team_b_id=team_b_id,
            game_time_seconds=599,
        )
    ) is None
    assert _snapshot_market_pair(
        _review_snapshot_record(
            decision_at=now,
            team_a_id=team_a_id,
            team_b_id=team_b_id,
            market_eligible=False,
        )
    ) is None
    assert _snapshot_market_pair(
        _review_snapshot_record(
            decision_at=now,
            team_a_id=team_a_id,
            team_b_id=team_b_id,
            snapshot_eligible=False,
        )
    ) is None
    eligible = _snapshot_market_pair(
        _review_snapshot_record(
            decision_at=now,
            team_a_id=team_a_id,
            team_b_id=team_b_id,
            game_time_seconds=600,
        )
    )
    assert eligible is not None
    assert eligible["odds_a"] == 2.2


def test_rosh_review_keeps_earliest_frozen_curve_when_later_snapshot_changes() -> None:
    now = datetime(2026, 8, 15, 12, 0, tzinfo=UTC)
    team_a_id, team_b_id = uuid4(), uuid4()
    early = _review_snapshot_record(
        decision_at=now,
        team_a_id=team_a_id,
        team_b_id=team_b_id,
        curve_points=[
            {"minute": 20, "pure_radiant_edge": 2.0, "adjusted_radiant_edge": 1.0},
            {"minute": 30, "pure_radiant_edge": 4.0, "adjusted_radiant_edge": -2.0},
            {"minute": 40, "pure_radiant_edge": 1.0, "adjusted_radiant_edge": -3.0},
        ],
    )
    late = _review_snapshot_record(
        decision_at=now + timedelta(minutes=5),
        team_a_id=team_a_id,
        team_b_id=team_b_id,
        curve_points=[
            {"minute": 20, "pure_radiant_edge": -20.0, "adjusted_radiant_edge": 20.0},
            {"minute": 30, "pure_radiant_edge": -30.0, "adjusted_radiant_edge": 30.0},
            {"minute": 40, "pure_radiant_edge": -40.0, "adjusted_radiant_edge": 40.0},
        ],
    )
    review = _rosh_review([early, late], winner_team_id=team_a_id)
    assert review is not None
    assert review["snapshot_id"] == str(early.id)
    assert review["reference"]["pure"]["edge_pp"] == 4.0
    assert review["reference"]["adjusted"]["edge_pp"] == -2.0


def test_rosh_reference_requires_exact_30_minute_point() -> None:
    now = datetime(2026, 8, 15, 12, 0, tzinfo=UTC)
    team_a_id, team_b_id = uuid4(), uuid4()
    snapshot = _review_snapshot_record(
        decision_at=now,
        team_a_id=team_a_id,
        team_b_id=team_b_id,
        curve_points=[
            {"minute": 29, "pure_radiant_edge": 4.0, "adjusted_radiant_edge": 2.0},
            {"minute": 31, "pure_radiant_edge": 5.0, "adjusted_radiant_edge": 3.0},
        ],
    )
    review = _rosh_review([snapshot], winner_team_id=team_a_id)
    assert review is not None
    assert review["reference"] is None
    assert next(item for item in review["points"] if item["minute"] == 30)["pure"]["edge_pp"] is None


def test_review_odds_ignores_capture_without_any_timestamp() -> None:
    now = datetime(2026, 8, 15, 12, 0, tzinfo=UTC)
    team_a_id, team_b_id = uuid4(), uuid4()
    snapshot = _review_snapshot_record(
        decision_at=now,
        team_a_id=team_a_id,
        team_b_id=team_b_id,
    )
    invalid_closing = SimpleNamespace(
        odds_a=Decimal("1.80"),
        odds_b=Decimal("2.05"),
        status="CAPTURED",
        observed_at=None,
        triggered_at=None,
    )
    review = _odds_review([snapshot], closings=[invalid_closing])
    assert review is not None
    assert review["end_kind"] == "LATEST_DECISION"
'''
          p.write_text(text.replace(marker, extra + marker, 1))

