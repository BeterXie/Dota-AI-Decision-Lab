name: Apply match review dashboard

on:
  push:
    branches:
      - feat/match-review-dashboard

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/match-review-dashboard
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wire review endpoint and docs
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "app/web/api.py",
              "from app.runtime.health import HealthRegistry\n",
              "from app.runtime.health import HealthRegistry\nfrom app.web.review import create_review_router\n",
          )
          replace_once(
              "app/web/api.py",
              '    @app.get("/health")\n',
              '    app.include_router(create_review_router(session_factory))\n\n    @app.get("/health")\n',
          )

          review = Path("app/web/review.py")
          text = review.read_text(encoding="utf-8")
          old = (
              '        if item.odds_a is not None and item.odds_b is not None and item.status == "CAPTURED"\n'
          )
          new = (
              '        if item.odds_a is not None\n'
              '        and item.odds_b is not None\n'
              '        and item.odds_a > 1\n'
              '        and item.odds_b > 1\n'
              '        and item.status == "CAPTURED"\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"app/web/review.py: closing guard mismatch: {text.count(old)}")
          review.write_text(text.replace(old, new, 1), encoding="utf-8")

          styles = Path("frontend/src/styles.scss")
          text = styles.read_text(encoding="utf-8")
          marker = ".review-nav-btn {"
          if marker not in text:
              anchor = ".system-status-btn {\n"
              css = (
                  ".review-nav-btn {\n"
                  "  display: inline-flex;\n"
                  "  align-items: center;\n"
                  "  padding: 6px 12px;\n"
                  "  border-radius: var(--radius-pill);\n"
                  "  border: 1px solid color-mix(in srgb, var(--ai-accent) 38%, transparent);\n"
                  "  background: color-mix(in srgb, var(--ai-accent) 10%, transparent);\n"
                  "  color: var(--text-secondary);\n"
                  "  font-size: 12px;\n"
                  "  font-weight: 650;\n"
                  "  text-decoration: none;\n"
                  "  transition: all 0.2s ease;\n"
                  "\n"
                  "  &:hover {\n"
                  "    color: var(--text-primary);\n"
                  "    border-color: color-mix(in srgb, var(--ai-accent) 64%, transparent);\n"
                  "    background: color-mix(in srgb, var(--ai-accent) 16%, transparent);\n"
                  "  }\n"
                  "}\n\n"
              )
              if text.count(anchor) != 1:
                  raise SystemExit("frontend/src/styles.scss: status button anchor mismatch")
              styles.write_text(text.replace(anchor, css + anchor, 1), encoding="utf-8")

          docs = Path("docs/ARCHITECTURE.md")
          text = docs.read_text(encoding="utf-8")
          heading = "## Post-match Review Analytics"
          if heading not in text:
              appendix = (
                  "\n\n---\n\n"
                  "## Post-match Review Analytics\n\n"
                  "Dashboard 提供独立 `/review` 复盘工作区，用于跨 Map 比较比赛结果、R.O.S.H.、AI 决策与赔率变化。"
                  "统计必须保持可审计且禁止赛后信息回填：R.O.S.H. 只读取当时已冻结进 immutable DecisionSnapshot 且阵营映射已 RESOLVED 的曲线；"
                  "主指标固定使用 30 分钟 pure/player-adjusted edge，并同时展示 20/30/40 分钟方向。"
                  "AI 按 `(snapshot, provider, model)` 只保留最新成功实验，BUY 命中率只统计已结算 BUY_A/BUY_B，"
                  "概率质量继续使用 Brier / log loss，风险偏好无关的收益比较使用 1-unit P&L / ROI。"
                  "赔率起点定义为首个可决策 Snapshot 的 Winner market，而不是伪称 bookmaker open；终点优先使用已捕获 CLOSING，"
                  "否则明确降级为最后一个有效 DecisionSnapshot market。\n"
              )
              docs.write_text(text.rstrip() + appendix + "\n", encoding="utf-8")
      - name: Format and lint backend
        run: |
          uv sync --frozen --extra dev
          uv run ruff format app/web/api.py app/web/review.py tests/test_review_api.py
          uv run ruff check app/web/api.py app/web/review.py tests/test_review_api.py
      - name: Run backend review contracts
        run: uv run pytest tests/test_review_api.py tests/test_web_api_contract.py
      - name: Run frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit validated wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/api.py app/web/review.py frontend/src/styles.scss docs/ARCHITECTURE.md
          git commit -m "feat(review): wire post-match analytics"
          git push origin HEAD:feat/match-review-dashboard
