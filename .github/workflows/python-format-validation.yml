name: Python format validation

on:
  push:
    branches:
      - feature/player-first-ui-redesign

permissions:
  contents: write

jobs:
  format-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: dota_ai_decision_lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dota_ai_decision_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/dota_ai_decision_lab
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/player-first-ui-redesign
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run alembic upgrade head
      - run: uv run ruff format app migrations tests tools
      - run: uv run ruff check app migrations tests tools
      - run: uv run pytest
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app migrations tests tools
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:feature/player-first-ui-redesign
