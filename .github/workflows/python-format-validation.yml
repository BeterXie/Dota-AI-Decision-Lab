name: Python side invariant validation

on:
  push:
    branches:
      - feature/player-first-ui-redesign

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: dota_ai_decision_lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dota_ai_decision_lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/dota_ai_decision_lab
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/player-first-ui-redesign
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run alembic upgrade head
      - name: Apply safe side fallback
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          path = Path("app/snapshots/side_aware.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if slots:
              if side_assignment is not None and side_assignment.resolved:
                  _align_history_to_series(history, side_assignment, series)
              else:
                  _remove_unassigned_roster_history(history)
                  history_blockers = [
                      blocker
                      for blocker in history_blockers
                      if blocker != "ROSTER_IDENTITY_AMBIGUOUS"
                  ]
                  history_warnings.append("ROSTER_SIDE_IDENTITY_UNRESOLVED")
          if draft_complete and (side_assignment is None or not side_assignment.resolved):
              history_blockers.append(
                  side_assignment.blocker
                  if side_assignment is not None and side_assignment.blocker is not None
                  else "SIDE_IDENTITY_UNRESOLVED"
              )
          '''
          new = '''        side_resolved = side_assignment is not None and side_assignment.resolved
          if slots:
              if side_resolved:
                  _align_history_to_series(history, side_assignment, series)
              else:
                  _remove_unassigned_roster_history(history)
                  history_blockers = [
                      blocker
                      for blocker in history_blockers
                      if blocker != "ROSTER_IDENTITY_AMBIGUOUS"
                  ]
                  history_warnings.append("ROSTER_SIDE_IDENTITY_UNRESOLVED")
          effective_draft_complete = draft_complete and side_resolved
          if draft_complete and not side_resolved:
              history_warnings.append(
                  side_assignment.blocker
                  if side_assignment is not None and side_assignment.blocker is not None
                  else "SIDE_IDENTITY_UNRESOLVED"
              )
          '''
          if old not in text:
              raise SystemExit("expected side fallback block not found")
          text = text.replace(old, new, 1)
          old_gate = "                draft_complete=draft_complete,"
          new_gate = "                draft_complete=effective_draft_complete,"
          if old_gate not in text:
              raise SystemExit("expected draft gate line not found")
          text = text.replace(old_gate, new_gate, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - run: uv run ruff format app migrations tests tools
      - run: uv run ruff check app migrations tests tools
      - run: uv run pytest
      - name: Commit validated correction and remove validator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app migrations tests tools
          git rm .github/workflows/python-format-validation.yml
          git commit -m "fix(snapshot): degrade unresolved map sides safely"
          git push origin HEAD:feature/player-first-ui-redesign
