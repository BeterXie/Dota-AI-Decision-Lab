name: Auth branch cleanup

on:
  push:
    branches:
      - feat/email-auth-notification-center

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/email-auth-notification-center
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.0'
          python-version: '3.14'
      - name: Apply deterministic cleanup
        run: python tools/auth_branch_cleanup.py
      - name: Format backend
        run: |
          uv sync --frozen --extra dev
          uv run ruff format app migrations tests tools
          uv run ruff check --fix app migrations tests tools
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app migrations tests tools frontend/src/i18n.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: align auth contracts and formatting"
          git push origin HEAD:feat/email-auth-notification-center
