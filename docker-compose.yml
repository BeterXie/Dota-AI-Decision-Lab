services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dota_ai_decision_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dota_lab_postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dota_ai_decision_lab"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  dota_lab_postgres18:
