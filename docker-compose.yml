services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dota_ai_decision_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # The application is intentionally loopback-only; keep the database on the
      # same trust boundary instead of publishing the development password to LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dota_lab_postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dota_ai_decision_lab"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  dota_lab_postgres18:
